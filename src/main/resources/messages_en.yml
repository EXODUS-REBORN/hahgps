# ============================================================
#  HahGps — messages (English)
#
#  Palette of the core plugin hahtojer (GuiTheme.TONES):
#  #08122b #0e2450 #14397e #1d51a8 #2464c8 #3f86ff #66aaff
#  #8fc6ff #4fd1e0 #8fe9f5
#  Neutrals: <white> — values, <gray> — labels,
#  <dark_gray> — separators, <red> — errors only.
#
#  Fonts (vanilla, no resource pack needed):
#  <font:minecraft:uniform> — pixel monospace: headers,
#      window titles, all numbers (coords, distances, pages).
#      Full coverage: Cyrillic, digits, symbols.
#  <font:minecraft:alt> — enchanting-table runes: ONLY pure
#      Latin (A-Z, a-z, space). Digits and Cyrillic do NOT
#      render in it — never use the tag for those.
#  Regular text — the default Minecraft font.
# ============================================================

prefix: "<gray>[</gray><font:minecraft:alt><gradient:#2464c8:#8fe9f5>GPS</gradient></font><gray>]</gray> "

# Palette schema version: a mismatch replaces the file with the bundled one (old -> .bak)
palette-version: 3

no-permission: "<red>✖ You don't have permission to run this command."
player-only: "<red>✖ This command is for players only."
usage: "<red>✖ Usage: <font:minecraft:uniform><white>{usage}</white></font>"
invalid-args: "<red>✖ Invalid arguments. <font:minecraft:uniform><white>{usage}</white></font>"

# --- Points ---
point-created: "<#8fe9f5>✔</#8fe9f5> <gray>Point</gray> <white>{name}</white> <dark_gray>created.</dark_gray>"
point-deleted: "<#8fe9f5>✔</#8fe9f5> <gray>Point</gray> <white>{name}</white> <dark_gray>deleted.</dark_gray>"
point-not-found: "<red>✖ Point <white>{name}</white> not found."
point-exists: "<red>✖ A point named <white>{name}</white> already exists."
point-info: |
  <font:minecraft:uniform><gradient:#2464c8:#8fe9f5>════════ POINT ════════</gradient></font>
  <gray>Name:</gray> <white>{name}</white>
  <gray>Category:</gray> <white>{category}</white>
  <gray>Coordinates:</gray> <font:minecraft:uniform><#8fe9f5>{x}, {y}, {z}</#8fe9f5></font>
  <gray>World:</gray> <white>{world}</white>
  <gray>Rating:</gray> <font:minecraft:uniform><#8fe9f5>{rating}/10</#8fe9f5></font> <dark_gray>· votes: <font:minecraft:uniform>{votes}</font></dark_gray>
  <gray>Author:</gray> <white>{author}</white>
  <gray>Created:</gray> <font:minecraft:uniform><white>{date}</white></font>
  <gray>Description:</gray> <white>{description}</white>
point-rated: "<#8fe9f5>✔</#8fe9f5> <gray>You rated</gray> <white>{name}</white> <dark_gray>—</dark_gray> <font:minecraft:uniform><#8fe9f5>{rating}</#8fe9f5>/10</font>"
invalid-rating: "<red>✖ Rating must be between <font:minecraft:uniform>1</font> and <font:minecraft:uniform>10</font>."
point-list-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ POINTS ({count}) ═══</gradient></font>"
point-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <font:minecraft:uniform><#8fe9f5>★{rating}</#8fe9f5></font> <dark_gray>|</dark_gray> <font:minecraft:uniform><gray>{distance}m</gray></font>"

# --- Categories ---
category-created: "<#8fe9f5>✔</#8fe9f5> <gray>Category</gray> <white>{name}</white> <dark_gray>created.</dark_gray>"
category-deleted: "<#8fe9f5>✔</#8fe9f5> <gray>Category</gray> <white>{name}</white> <dark_gray>deleted.</dark_gray>"
category-not-found: "<red>✖ Category <white>{name}</white> not found."
category-exists: "<red>✖ A category with that name already exists."
cannot-delete-default: "<red>✖ Cannot delete a default category."
category-list-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ CATEGORIES ({count}) ═══</gradient></font>"
category-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>(</dark_gray><font:minecraft:uniform><gray>{count}</gray></font> <gray>points</gray><dark_gray>)</dark_gray>"

# --- Routes & navigation ---
route-started: "<#8fe9f5>✔</#8fe9f5> <gray>Navigation to</gray> <white>{name}</white> <dark_gray>started · remaining</dark_gray> <font:minecraft:uniform><#8fe9f5>{distance} m</#8fe9f5></font>"
route-stopped: "<#8fe9f5>✔</#8fe9f5> <gray>Navigation stopped.</gray>"
no-active-route: "<red>✖ You have no active navigation."
arrival: "<font:minecraft:uniform><#8fe9f5>✔ DESTINATION REACHED</#8fe9f5></font>"

# --- Hints ---
hint-straight: "<font:minecraft:uniform><#66aaff>↑ Go straight</#66aaff></font>"
hint-slight-right: "<font:minecraft:uniform><#8fc6ff>↗ Slight right</#8fc6ff></font>"
hint-right: "<font:minecraft:uniform><#8fc6ff>→ Turn right</#8fc6ff></font>"
hint-sharp-right: "<font:minecraft:uniform><#8fe9f5>↘ Sharp right</#8fe9f5></font>"
hint-back: "<font:minecraft:uniform><#3f86ff>↩ Turn around</#3f86ff></font>"
hint-sharp-left: "<font:minecraft:uniform><#8fe9f5>↙ Sharp left</#8fe9f5></font>"
hint-left: "<font:minecraft:uniform><#8fc6ff>← Turn left</#8fc6ff></font>"
hint-slight-left: "<font:minecraft:uniform><#8fc6ff>↖ Slight left</#8fc6ff></font>"

# --- Logging ---
log-enabled: "<#8fe9f5>✔</#8fe9f5> <gray>Route logging enabled.</gray>"
log-disabled: "<#8fe9f5>✔</#8fe9f5> <gray>Route logging disabled.</gray>"

# --- Search ---
search-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ SEARCH ({count}) ═══</gradient></font>"
search-no-results: "<red>✖ Nothing found for <white>{query}</white>."
search-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <font:minecraft:uniform><#8fe9f5>{match}%</#8fe9f5></font>"

# --- Misc ---
reloaded: "<#8fe9f5>✔</#8fe9f5> <gray>HahGps configuration reloaded.</gray>"
loading-data: "<gray>Loading data…</gray>"
error-occurred: "<red>✖ An error occurred: <white>{error}</white>"
world-not-found: "<red>✖ World <white>{world}</white> not found."
# NOTE: distance-format goes into the BossBar as plain text — no MiniMessage tags
distance-format: "{value} m"
distance-format-km: "{value} km"

# --- Help ---
help-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ GPS COMMANDS ═══</gradient></font>"
help-entry: "<font:minecraft:uniform><#8fc6ff>{usage}</#8fc6ff></font> <dark_gray>──</dark_gray> <gray>{description}</gray>"
help-menu: "Open main menu"
help-point: "Manage points"
help-category: "Manage categories"
help-route: "Manage routes"
help-goto: "Build route to a point"
help-search: "Search points"
help-map: "Open map"
help-log: "Toggle chat hints"
help-reload: "Reload config"
help-help: "Show this help"
help-update: "Check for and install updates"
help-edge: "Manage road graph edges"
help-visual: "Visualize the road graph"

# --- Updates (/gps update) ---
update-checking: "<gray>Checking releases…</gray>"
update-downloading: "<gray>Checking and downloading a new version…</gray>"
update-nothing-to-apply: "<red>✖ Nothing to apply: no staged update <dark_gray>(run</dark_gray> <font:minecraft:uniform><white>/gps update install</white></font><dark_gray> first)</dark_gray>."
update-hotswap-failed: "<red>✖ Hot swap failed: <white>{reason}</white>"
update-reloaded: "<#8fe9f5>✔</#8fe9f5> <gray>Update settings reloaded.</gray>"

# --- Update announcements (to groups from обновление.группы-оповещения) ---
update-available: "<gray>New update available:</gray> <font:minecraft:uniform><white>{version}</white></font> <dark_gray>·</dark_gray> <gray>released:</gray> <font:minecraft:uniform><white>{date}</white></font>"
update-whats-new: "<gray>What's new:</gray> <white>{notes}</white>"
update-downloading-now: "<gray>Downloading update…</gray>"
update-staged: "<#8fe9f5>✔</#8fe9f5> <gray>Update</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>downloaded and verified — ready to install.</gray>"
update-installed: "<#8fe9f5>✔</#8fe9f5> <gray>Update</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>installed successfully — server was not restarted.</gray>"
update-failed: "<red>✖ Update failed: <white>{error}</white></red>"

# --- Chat input ---
input-category-create: "<gray>→ Type the new category name in chat:</gray>"
input-category-delete: "<gray>→ Type the category name to delete in chat:</gray>"
input-rate: "<gray>→ Rate the point from</gray> <font:minecraft:uniform><#8fe9f5>1</#8fe9f5></font> <gray>to</gray> <font:minecraft:uniform><#8fe9f5>10</#8fe9f5></font> <dark_gray>— type a number in chat:</dark_gray>"
input-search: "<gray>→ Type a search query in chat:</gray>"

