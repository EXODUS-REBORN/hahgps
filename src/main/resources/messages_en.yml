# ============================================================
#  HahGps — messages (English)
#
#  Palette of the core plugin hahtojer (GuiTheme.TONES):
#  #08122b #0e2450 #14397e #1d51a8 #2464c8 #3f86ff #66aaff
#  #8fc6ff #4fd1e0 #8fe9f5
#  Neutrals: <white> — values, <gray> — labels,
#  <dark_gray> — separators, <red> — errors only.
# ============================================================

prefix: "<gray>[</gray><gradient:#2464c8:#8fe9f5>GPS</gradient><gray>]</gray> "

# Palette schema version: a mismatch replaces the file with the bundled one (old -> .bak)
palette-version: 2

no-permission: "<red>You don't have permission to run this command."
player-only: "<red>This command is for players only."
usage: "<red>Usage: <white>{usage}"
invalid-args: "<red>Invalid arguments. <white>{usage}"

# --- Points ---
point-created: "<#8fc6ff>Point <white>{name}</white> created."
point-deleted: "<#8fc6ff>Point <white>{name}</white> deleted."
point-not-found: "<red>Point <white>{name}</white> not found."
point-exists: "<red>A point named <white>{name}</white> already exists."
point-info: |
  <#8fc6ff>══════════ Point ══════════</#8fc6ff>
  <gray>Name:</gray> <white>{name}</white>
  <gray>Category:</gray> <white>{category}</white>
  <gray>Coordinates:</gray> <white>{x}, {y}, {z}</white>
  <gray>World:</gray> <white>{world}</white>
  <gray>Rating:</gray> <#8fe9f5>{rating}/10</#8fe9f5> <dark_gray>(votes: {votes})</dark_gray>
  <gray>Author:</gray> <white>{author}</white>
  <gray>Created:</gray> <white>{date}</white>
  <gray>Description:</gray> <white>{description}</white>
point-rated: "<#8fc6ff>You rated <white>{name}</white> as <#8fe9f5>{rating}</#8fe9f5>."
invalid-rating: "<red>Rating must be between 1 and 10."
point-list-header: "<#8fc6ff>═══ All points ({count}) ═══</#8fc6ff>"
point-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <#8fe9f5>★{rating}</#8fe9f5> <dark_gray>|</dark_gray> <gray>{distance}m</gray>"

# --- Categories ---
category-created: "<#8fc6ff>Category <white>{name}</white> created."
category-deleted: "<#8fc6ff>Category <white>{name}</white> deleted."
category-not-found: "<red>Category <white>{name}</white> not found."
category-exists: "<red>A category with that name already exists."
cannot-delete-default: "<red>Cannot delete a default category."
category-list-header: "<#8fc6ff>═══ Categories ({count}) ═══</#8fc6ff>"
category-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>(</dark_gray><gray>{count} points</gray><dark_gray>)</dark_gray>"

# --- Routes & navigation ---
route-started: "<#8fc6ff>Navigation to <white>{name}</white> started. Distance: <#8fe9f5>{distance} m</#8fe9f5>."
route-stopped: "<#8fc6ff>Navigation stopped."
no-active-route: "<red>You have no active navigation."
arrival: "<#8fe9f5>✔ Destination reached!"

# --- Hints ---
hint-straight: "<#66aaff>↑ Go straight</#66aaff>"
hint-slight-right: "<#8fc6ff>↗ Slight right</#8fc6ff>"
hint-right: "<#8fc6ff>→ Turn right</#8fc6ff>"
hint-sharp-right: "<#8fe9f5>↘ Sharp right</#8fe9f5>"
hint-back: "<#3f86ff>↩ Turn around</#3f86ff>"
hint-sharp-left: "<#8fe9f5>↙ Sharp left</#8fe9f5>"
hint-left: "<#8fc6ff>← Turn left</#8fc6ff>"
hint-slight-left: "<#8fc6ff>↖ Slight left</#8fc6ff>"

# --- Logging ---
log-enabled: "<#8fc6ff>Route logging enabled."
log-disabled: "<#8fc6ff>Route logging disabled."

# --- Search ---
search-header: "<#8fc6ff>═══ Search results ({count}) ═══</#8fc6ff>"
search-no-results: "<red>Nothing found for <white>{query}</white>."
search-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <#8fe9f5>{match}%</#8fe9f5>"

# --- Misc ---
reloaded: "<#8fc6ff>HahGps configuration reloaded."
loading-data: "<gray>Loading data...</gray>"
error-occurred: "<red>An error occurred: <white>{error}</white>"
world-not-found: "<red>World <white>{world}</white> not found."
distance-format: "{value} m"
distance-format-km: "{value} km"

# --- Help ---
help-header: "<#8fc6ff>═══ GPS commands ═══</#8fc6ff>"
help-entry: "<#8fc6ff>{usage}</#8fc6ff> <gray>— {description}</gray>"
help-menu: "Open main menu"
help-point: "Manage points"
help-category: "Manage categories"
help-route: "Manage routes"
help-goto: "Build route to a point"
help-search: "Search points"
help-map: "Open map"
help-log: "Toggle chat hints"
help-reload: "Reload config"
help-help: "Show this help"
help-update: "Check for and install updates"
help-edge: "Manage road graph edges"
help-visual: "Visualize the road graph"

# --- Updates (/gps update) ---
update-checking: "<#8fc6ff>Checking releases…"
update-downloading: "<#8fc6ff>Checking and downloading a new version…"
update-nothing-to-apply: "<#8fc6ff>Nothing to apply: no staged update (run &f/gps update install<#8fc6ff> first)."
update-hotswap-failed: "<red>Hot swap failed: <white>{reason}</white>"
update-reloaded: "<#8fc6ff>Update settings reloaded."

# --- Chat input ---
input-category-create: "<#8fc6ff>Type the new category name in chat:</#8fc6ff>"
input-category-delete: "<#8fc6ff>Type the category name to delete in chat:</#8fc6ff>"
input-rate: "<#8fc6ff>Rate the point from 1 to 10 — type a number in chat:</#8fc6ff>"
input-search: "<#8fc6ff>Type a search query in chat:</#8fc6ff>"

