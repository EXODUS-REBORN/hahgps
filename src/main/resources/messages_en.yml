# ============================================================
#  HahGps — messages (English)
# ============================================================

prefix: "<#8fc6ff>[GPS]<reset> "

no-permission: "<#3f86ff>You don't have permission to run this command."
player-only: "<#3f86ff>This command is for players only."
usage: "<#3f86ff>Usage: <#b8dcff>{usage}"
invalid-args: "<#3f86ff>Invalid arguments. <#b8dcff>{usage}"

# --- Points ---
point-created: "<#8fc6ff>Point <#b8dcff>{name}</#b8dcff> created."
point-deleted: "<#8fc6ff>Point <#b8dcff>{name}</#b8dcff> deleted."
point-not-found: "<#3f86ff>Point <#b8dcff>{name}</#b8dcff> not found."
point-exists: "<#3f86ff>A point named <#b8dcff>{name}</#b8dcff> already exists."
point-info: |
  <#8fc6ff>══════════ Point ══════════</#8fc6ff>
  <#c8e4ff>Name:</#c8e4ff> <white>{name}</white>
  <#c8e4ff>Category:</#c8e4ff> {category}
  <#c8e4ff>Coordinates:</#c8e4ff> <white>{x}, {y}, {z}</white>
  <#c8e4ff>World:</#c8e4ff> {world}
  <#c8e4ff>Rating:</#c8e4ff> <#b8dcff>{rating}/10</#b8dcff> <#c8e4ff>(votes: {votes})</#c8e4ff>
  <#c8e4ff>Author:</#c8e4ff> {author}
  <#c8e4ff>Created:</#c8e4ff> {date}
  <#c8e4ff>Description:</#c8e4ff> {description}
point-rated: "<#8fc6ff>You rated <#b8dcff>{name}</#b8dcff> as <#b8dcff>{rating}</#b8dcff>."
invalid-rating: "<#3f86ff>Rating must be between 1 and 10."
point-list-header: "<#8fc6ff>═══ All points ({count}) ═══</#8fc6ff>"
point-list-entry: "<#b8dcff>•</#b8dcff> {name} <#c8e4ff>|</#c8e4ff> {category} <#c8e4ff>|</#c8e4ff> ★{rating} <#c8e4ff>|</#c8e4ff> {distance}m"

# --- Categories ---
category-created: "<#8fc6ff>Category <#b8dcff>{name}</#b8dcff> created."
category-deleted: "<#8fc6ff>Category <#b8dcff>{name}</#b8dcff> deleted."
category-not-found: "<#3f86ff>Category <#b8dcff>{name}</#b8dcff> not found."
category-exists: "<#3f86ff>A category with that name already exists."
cannot-delete-default: "<#3f86ff>Cannot delete a default category."
category-list-header: "<#8fc6ff>═══ Categories ({count}) ═══</#8fc6ff>"
category-list-entry: "<#b8dcff>•</#b8dcff> {name} <#c8e4ff>({count} points)</#c8e4ff>"

# --- Routes & navigation ---
route-started: "<#8fc6ff>Navigation to <#b8dcff>{name}</#b8dcff> started. Distance: <#b8dcff>{distance} m</#b8dcff>."
route-stopped: "<#8fc6ff>Navigation stopped."
no-active-route: "<#3f86ff>You have no active navigation."
arrival: "<#8fc6ff>✔ Destination reached!"

# --- Hints ---
hint-straight: "<#c8e4ff>↑ Go straight</#c8e4ff>"
hint-slight-right: "<#b8dcff>↗ Slight right</#b8dcff>"
hint-right: "<#b8dcff>→ Turn right</#b8dcff>"
hint-sharp-right: "<#b8dcff>↘ Sharp right</#b8dcff>"
hint-back: "<#3f86ff>↩ Turn around</#3f86ff>"
hint-sharp-left: "<#b8dcff>↙ Sharp left</#b8dcff>"
hint-left: "<#b8dcff>← Turn left</#b8dcff>"
hint-slight-left: "<#b8dcff>↖ Slight left</#b8dcff>"

# --- Logging ---
log-enabled: "<#8fc6ff>Route logging enabled."
log-disabled: "<#8fc6ff>Route logging disabled."

# --- Search ---
search-header: "<#8fc6ff>═══ Search results ({count}) ═══</#8fc6ff>"
search-no-results: "<#3f86ff>Nothing found for <#b8dcff>{query}</#b8dcff>."
search-entry: "<#b8dcff>•</#b8dcff> {name} <#c8e4ff>|</#c8e4ff> {match}%"

# --- Misc ---
reloaded: "<#8fc6ff>HahGps configuration reloaded."
loading-data: "<#c8e4ff>Loading data...</#c8e4ff>"
error-occurred: "<#3f86ff>An error occurred: {error}"
world-not-found: "<#3f86ff>World <#b8dcff>{world}</#b8dcff> not found."
distance-format: "{value} m"

# --- Help ---
help-header: "<#8fc6ff>═══ GPS commands ═══</#8fc6ff>"
help-entry: "<#b8dcff>{usage}</#b8dcff> <#c8e4ff>— {description}</#c8e4ff>"
help-menu: "Open main menu"
help-point: "Manage points"
help-category: "Manage categories"
help-route: "Manage routes"
help-goto: "Build route to a point"
help-search: "Search points"
help-map: "Open map"
help-start: "Start navigation"
help-stop: "Stop navigation"
help-record: "Record route (admin)"
help-save: "Save route"
help-list: "List routes"
help-log: "Toggle chat hints"
help-reload: "Reload config"
help-help: "Show this help"

