  next-page: "<#8fc6ff>→ Next page</#8fc6ff>"
  prev-page: "<#8fc6ff>← Previous page</#8fc6ff>"
  page-info: "<#c8e4ff>Page {page}/{pages}</#c8e4ff>"
  points-title: "<#8fc6ff>My points</#8fc6ff>"
  categories-title: "<#8fc6ff>Categories</#8fc6ff>"
  search-title: "<#8fc6ff>Search</#8fc6ff>"
  transport-title: "<#8fc6ff>Transport</#8fc6ff>"
  settings-title: "<#8fc6ff>Settings</#8fc6ff>"
  map-title: "<#8fc6ff>Map</#8fc6ff>"
  poi-actions-title: "<#8fc6ff>Point: {name}</#8fc6ff>"
  info: "<#8fc6ff>Info</#8fc6ff>"
  goto: "<#8fc6ff>Build route</#8fc6ff>"
  rate: "<#8fc6ff>Rate</#8fc6ff>"
  delete: "<#3f86ff>Delete</#3f86ff>"
  create: "<#8fc6ff>Create</#8fc6ff>"
  zoom-in: "<#8fc6ff>Zoom in</#8fc6ff>"
