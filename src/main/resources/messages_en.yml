# ============================================================
#  HahGps — messages (English)
# ============================================================

prefix: "<#4fd1e0>[GPS]<reset> "

no-permission: "<red>You don't have permission to run this command."
player-only: "<red>This command is for players only."
usage: "<red>Usage: <#8fe9f5>{usage}"
invalid-args: "<red>Invalid arguments. <#8fe9f5>{usage}"

# --- Points ---
point-created: "<#8fc6ff>Point <#8fe9f5>{name}</#8fe9f5> created."
point-deleted: "<#8fc6ff>Point <#8fe9f5>{name}</#8fe9f5> deleted."
point-not-found: "<red>Point <#8fe9f5>{name}</#8fe9f5> not found."
point-exists: "<red>A point named <#8fe9f5>{name}</#8fe9f5> already exists."
point-info:
  "<#4fd1e0>══════════ Point ══════════</#4fd1e0>"
  "<gray>Name:</gray> <white>{name}</white>"
  "<gray>Category:</gray> {category}"
  "<gray>Coordinates:</gray> <white>{x}, {y}, {z}</white>"
  "<gray>World:</gray> {world}"
  "<gray>Rating:</gray> <#8fe9f5>{rating}/10</#8fe9f5> <gray>(votes: {votes})</gray>"
  "<gray>Author:</gray> {author}"
  "<gray>Created:</gray> {date}"
  "<gray>Description:</gray> {description}"
point-rated: "<#8fc6ff>You rated <#8fe9f5>{name}</#8fe9f5> as <#8fe9f5>{rating}</#8fe9f5>."
invalid-rating: "<red>Rating must be between 1 and 10."
point-list-header: "<#4fd1e0>═══ All points ({count}) ═══</#4fd1e0>"
point-list-entry: "<#8fe9f5>•</#8fe9f5> {name} <gray>|</gray> {category} <gray>|</gray> ★{rating} <gray>|</gray> {distance}m"

# --- Categories ---
category-created: "<#8fc6ff>Category <#8fe9f5>{name}</#8fe9f5> created."
category-deleted: "<#8fc6ff>Category <#8fe9f5>{name}</#8fe9f5> deleted."
category-not-found: "<red>Category <#8fe9f5>{name}</#8fe9f5> not found."
category-exists: "<red>A category with that name already exists."
cannot-delete-default: "<red>Cannot delete a default category."
category-list-header: "<#4fd1e0>═══ Categories ({count}) ═══</#4fd1e0>"
category-list-entry: "<#8fe9f5>•</#8fe9f5> {name} <gray>({count} points)</gray>"

# --- Routes & navigation ---
route-started: "<#8fc6ff>Navigation to <#8fe9f5>{name}</#8fe9f5> started. Distance: <#8fe9f5>{distance} m</#8fe9f5>."
route-stopped: "<#8fc6ff>Navigation stopped."
no-active-route: "<red>You have no active navigation."
arrival: "<#8fc6ff>✔ Destination reached!"

# --- Hints ---
hint-straight: "<gray>↑ Go straight</gray>"
hint-slight-right: "<#8fe9f5>↗ Slight right</#8fe9f5>"
hint-right: "<#8fe9f5>→ Turn right</#8fe9f5>"
hint-sharp-right: "<#8fe9f5>↘ Sharp right</#8fe9f5>"
hint-back: "<red>↩ Turn around</red>"
hint-sharp-left: "<#8fe9f5>↙ Sharp left</#8fe9f5>"
hint-left: "<#8fe9f5>← Turn left</#8fe9f5>"
hint-slight-left: "<#8fe9f5>↖ Slight left</#8fe9f5>"

# --- Logging ---
log-enabled: "<#8fc6ff>Route logging enabled."
log-disabled: "<#8fc6ff>Route logging disabled."

# --- Search ---
search-header: "<#4fd1e0>═══ Search results ({count}) ═══</#4fd1e0>"
search-no-results: "<red>Nothing found for <#8fe9f5>{query}</#8fe9f5>."
search-entry: "<#8fe9f5>•</#8fe9f5> {name} <gray>|</gray> {match}%"

# --- Misc ---
reloaded: "<#8fc6ff>HahGps configuration reloaded."
loading-data: "<gray>Loading data...</gray>"
error-occurred: "<red>An error occurred: {error}"
world-not-found: "<red>World <#8fe9f5>{world}</#8fe9f5> not found."
distance-format: "{value} m"

# --- Help ---
help-header: "<#4fd1e0>═══ GPS commands ═══</#4fd1e0>"
help-entry: "<#8fe9f5>{usage}</#8fe9f5> <gray>— {description}</gray>"
help-menu: "Open main menu"
help-point: "Manage points"
help-category: "Manage categories"
help-route: "Manage routes"
help-goto: "Build route to a point"
help-search: "Search points"
help-map: "Open map"
help-start: "Start navigation"
help-stop: "Stop navigation"
help-record: "Record route (admin)"
help-save: "Save route"
help-list: "List routes"
help-log: "Toggle chat hints"
help-reload: "Reload config"
help-help: "Show this help"

# --- GUI ---
