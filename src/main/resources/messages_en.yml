  recenter: "<#8fc6ff>Recenter on me</#8fc6ff>"
  rating-stars: "<#b8dcff>{stars}</#b8dcff><#c8e4ff>{empty}</#c8e4ff>"
  distance: "<#c8e4ff>{distance} m</#c8e4ff>"
  category: "<#c8e4ff>{category}</#c8e4ff>"
  search-hint: "<#c8e4ff>Click to type a query in chat</#c8e4ff>"
  language: "<#8fc6ff>Language: {language}</#8fc6ff>"
  logging: "<#8fc6ff>Chat hints: {state}</#8fc6ff>"
  transport-foot: "<#8fc6ff>On foot</#8fc6ff>"
