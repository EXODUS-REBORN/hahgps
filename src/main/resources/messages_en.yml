# ============================================================
#  HahGps — messages (English)
#
#  ONE TEMPLATE: the blue line of GuiTheme.PALETTE plus neutrals.
#  No green, red, gold, orange, purple or pink anywhere in texts —
#  everything is distinguished by a shade of blue.
#  Values — <white><bold>, labels — <gray>, separators —
#  <dark_gray>, soft notes — <italic>.
#
#  Semantic tones (all from the blue line):
#    #8fe9f5 — ✔ success (the lightest tone)
#    #8fc6ff — values and button names
#    #66aaff — → prompts and hints
#    #4fd1e0 — "sharp turn" hints
#    #3f86ff — ✖ errors (the darkest tone, bold)
#
#  Line templates (the same for every message):
#    success — <#8fe9f5>✔</#8fe9f5> <gray>text</gray> <white><bold>value</bold></white>
#    error   — <#3f86ff>✖ text <white><bold>value</bold></white></#3f86ff>
#    prompt  — <#66aaff>→</#66aaff> <gray>text</gray>
#    header  — <bold><gradient:#2464c8:#8fe9f5>═══ TITLE ═══</gradient></bold>
#
#  Font and size: regular text uses the default Minecraft font.
#  Size variation (the uniform micro font) is used ONLY for
#  time and versions: <font:minecraft:uniform>…</font>
#  around {date} and {version}.
#  Emphasis comes from decorations: <bold> — headers and values,
#  <italic> — hints.
#
#  Texts never overflow windows or tooltips: names and labels
#  are clipped by the code (GuiTheme.clipPlain/clipMini).
# ============================================================

prefix: "<gray>[</gray><bold><gradient:#2464c8:#8fe9f5>GPS</gradient></bold><gray>]</gray> "

# Palette schema version: a mismatch replaces the file with the bundled one (old -> .bak)
palette-version: 19

no-permission: "<#3f86ff>✖ You don't have permission to run this command.</#3f86ff>"
player-only: "<#3f86ff>✖ This command is for players only.</#3f86ff>"
usage: "<#3f86ff>✖ Usage:</#3f86ff> <bold><white>{usage}</white></bold>"
invalid-args: "<#3f86ff>✖ Invalid arguments.</#3f86ff> <gray>Usage:</gray> <bold><white>{usage}</white></bold>"

