# ============================================================
#  HahGps — messages (English)
#
#  Colors — the RGB palette GuiTheme.PALETTE: texts use dozens
#  of shades (blue, cyan, green, gold, orange, purple, pink,
#  red), not just 3–4 colors.
#  Neutrals: <white> — values, <gray> — labels,
#  <dark_gray> — separators.
#
#  Font and size: regular text uses the default Minecraft font.
#  Size variation (the uniform micro font) is used ONLY for
#  time and versions: <font:minecraft:uniform>…</font>
#  around {date} and {version}.
#  Emphasis comes from decorations: <bold> — headers and values,
#  <italic> — hints, <underlined>/<strikethrough> — accents.
#
#  Message templates (same for every message):
#    success — <#4ade80>✔</#4ade80> <gray>text</gray> <white>value</white>
#    error   — <#f87171>✖ text <white>value</white></#f87171>
#    prompt  — <#c084fc>→</#c084fc> <gray>text</gray>
#    header  — <bold><gradient:…>═══ TITLE ═══</gradient></bold>
#
#  Texts never overflow windows or tooltips: names and labels
#  are clipped by the code (GuiTheme.clipPlain/clipMini).
# ============================================================

prefix: "<gray>[</gray><bold><gradient:#2464c8:#8fe9f5>GPS</gradient></bold><gray>]</gray> "

# Palette schema version: a mismatch replaces the file with the bundled one (old -> .bak)
palette-version: 4

no-permission: "<#f87171>✖ You don't have permission to run this command.</#f87171>"
player-only: "<#f87171>✖ This command is for players only.</#f87171>"
usage: "<#f87171>✖ Usage:</#f87171> <bold><white>{usage}</white></bold>"
invalid-args: "<#f87171>✖ Invalid arguments.</#f87171> <gray>Usage:</gray> <bold><white>{usage}</white></bold>"

# --- Points ---
point-created: "<#4ade80>✔</#4ade80> <gray>Point</gray> <white><bold>{name}</bold></white> <dark_gray>created.</dark_gray>"
point-deleted: "<#4ade80>✔</#4ade80> <gray>Point</gray> <white><bold>{name}</bold></white> <dark_gray>deleted.</dark_gray>"
point-not-found: "<#f87171>✖ Point <white><bold>{name}</bold></white> not found.</#f87171>"
point-exists: "<#f87171>✖ A point named <white><bold>{name}</bold></white> already exists.</#f87171>"
point-info: |
  <bold><gradient:#2464c8:#8fe9f5>════════ POINT ════════</gradient></bold>
  <gray>Name:</gray> <white><bold>{name}</bold></white>
  <gray>Category:</gray> <#22d3ee>{category}</#22d3ee>
  <gray>Coordinates:</gray> <#22d3ee><bold>{x}, {y}, {z}</bold></#22d3ee>
  <gray>World:</gray> <white>{world}</white>
  <gray>Rating:</gray> <#fbbf24><bold>{rating}/10</bold></#fbbf24> <dark_gray>·</dark_gray> <gray>votes:</gray> <white>{votes}</white>
  <gray>Author:</gray> <white>{author}</white>
  <gray>Created:</gray> <font:minecraft:uniform><white>{date}</white></font>
  <gray>Description:</gray> <white><italic>{description}</italic></white>
point-rated: "<#4ade80>✔</#4ade80> <gray>You rated</gray> <white><bold>{name}</bold></white> <dark_gray>—</dark_gray> <#fbbf24><bold>{rating}</bold></#fbbf24><gray>/10</gray>"
invalid-rating: "<#f87171>✖ Rating must be between <bold>1</bold> and <bold>10</bold>.</#f87171>"
point-list-header: "<bold><gradient:#2464c8:#8fe9f5>═══ POINTS ({count}) ═══</gradient></bold>"
point-list-entry: "<#22d3ee>•</#22d3ee> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <#fbbf24>★ {rating}</#fbbf24> <dark_gray>|</dark_gray> <#4ade80>{distance}</#4ade80>"

# --- Categories ---
category-created: "<#4ade80>✔</#4ade80> <gray>Category</gray> <white><bold>{name}</bold></white> <dark_gray>created.</dark_gray>"
category-deleted: "<#4ade80>✔</#4ade80> <gray>Category</gray> <white><bold>{name}</bold></white> <dark_gray>deleted.</dark_gray>"
category-not-found: "<#f87171>✖ Category <white><bold>{name}</bold></white> not found.</#f87171>"
category-exists: "<#f87171>✖ A category with that name already exists.</#f87171>"
cannot-delete-default: "<#f87171>✖ Cannot delete a default category.</#f87171>"
category-list-header: "<bold><gradient:#22c55e:#a3e635>═══ CATEGORIES ({count}) ═══</gradient></bold>"
category-list-entry: "<#4ade80>•</#4ade80> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <gray>points:</gray> <#a3e635><bold>{count}</bold></#a3e635>"

# --- Routes & navigation ---
route-started: "<#4ade80>✔</#4ade80> <gray>Navigation to</gray> <white><bold>{name}</bold></white> <dark_gray>started · remaining</dark_gray> <#fb923c><bold>{distance}</bold></#fb923c>"
route-stopped: "<#4ade80>✔</#4ade80> <gray>Navigation stopped.</gray>"
no-active-route: "<#f87171>✖ You have no active navigation.</#f87171>"
arrival: "<#4ade80><bold>✔ DESTINATION REACHED</bold></#4ade80>"

# --- Hints ---
hint-straight: "<#4ade80><bold>↑ Go straight</bold></#4ade80>"
hint-slight-right: "<#22d3ee><bold>↗ Slightly right</bold></#22d3ee>"
hint-right: "<#38bdf8><bold>→ Turn right</bold></#38bdf8>"
hint-sharp-right: "<#818cf8><bold>↘ Sharp right</bold></#818cf8>"
hint-back: "<#f87171><bold>↩ Turn around</bold></#f87171>"
hint-sharp-left: "<#818cf8><bold>↙ Sharp left</bold></#818cf8>"
hint-left: "<#38bdf8><bold>← Turn left</bold></#38bdf8>"
hint-slight-left: "<#22d3ee><bold>↖ Slightly left</bold></#22d3ee>"

# --- Logging ---
log-enabled: "<#4ade80>✔</#4ade80> <gray>Chat hints enabled.</gray>"
log-disabled: "<#4ade80>✔</#4ade80> <gray>Chat hints disabled.</gray>"

# --- Search ---
search-header: "<bold><gradient:#a855f7:#f472b6>═══ SEARCH ({count}) ═══</gradient></bold>"
search-no-results: "<#f87171>✖ Nothing found for <white><bold>{query}</bold></white>.</#f87171>"
search-entry: "<#c084fc>•</#c084fc> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <#f472b6><bold>{match}%</bold></#f472b6>"

# --- Misc ---
reloaded: "<#4ade80>✔</#4ade80> <gray>HahGps configuration reloaded.</gray>"
loading-data: "<gray><italic>Loading data…</italic></gray>"
error-occurred: "<#f87171>✖ An error occurred:</#f87171> <white>{error}</white>"
world-not-found: "<#f87171>✖ World <white><bold>{world}</bold></white> not found.</#f87171>"
# NOTE: distance-format goes into the BossBar as plain text — no MiniMessage tags
distance-format: "{value} m"
distance-format-km: "{value} km"

# --- Help ---
help-header: "<bold><gradient:#3b82f6:#22d3ee>═══ GPS COMMANDS ═══</gradient></bold>"
help-entry: "<#38bdf8><bold>{usage}</bold></#38bdf8> <dark_gray>──</dark_gray> <gray><italic>{description}</italic></gray>"
help-menu: "Open the main menu"
help-point: "Manage points"
help-category: "Manage categories"
help-route: "Manage routes"
help-goto: "Build a route to a point"
help-search: "Search points"
help-map: "Open the map"
help-log: "Navigation chat hints"
help-reload: "Reload the configuration"
help-help: "Show this help"
help-update: "Check for and install updates"
help-edge: "Manage road graph edges"
help-visual: "Visualize the road graph"

# --- Updates (/gps update) ---
update-checking: "<gray><italic>Checking releases…</italic></gray>"
update-downloading: "<gray><italic>Downloading a new version…</italic></gray>"
update-nothing-to-apply: "<#f87171>✖ Nothing to apply — download an update first:</#f87171> <bold><white>/gps update install</white></bold>"
update-hotswap-failed: "<#f87171>✖ Hot swap failed:</#f87171> <white>{reason}</white>"
update-reloaded: "<#4ade80>✔</#4ade80> <gray>Update settings reloaded.</gray>"

# --- Update announcements (to groups from обновление.группы-оповещения) ---
update-available: "<#fbbf24><bold>⬆ Update available</bold></#fbbf24> <font:minecraft:uniform><white>{version}</white></font> <dark_gray>·</dark_gray> <gray>released</gray> <font:minecraft:uniform><white>{date}</white></font>"
update-whats-new: "<gray>What's new:</gray> <white><italic>{notes}</italic></white>"
update-downloading-now: "<gray><italic>Downloading update…</italic></gray>"
update-staged: "<#4ade80>✔</#4ade80> <gray>Update</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>downloaded and verified — ready to install.</gray>"
update-installed: "<#4ade80>✔</#4ade80> <gray>Update</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>installed successfully — the server was not restarted.</gray>"
update-failed: "<#f87171>✖ Update failed:</#f87171> <white>{error}</white>"

# --- Chat input ---
input-category-create: "<#c084fc>→</#c084fc> <gray>Type the new category name in chat:</gray>"
input-category-delete: "<#c084fc>→</#c084fc> <gray>Type the category name to delete in chat:</gray>"
input-rate: "<#c084fc>→</#c084fc> <gray>Rate the point from</gray> <#fbbf24><bold>1</bold></#fbbf24> <gray>to</gray> <#fbbf24><bold>10</bold></#fbbf24> <dark_gray>— type a number in chat:</dark_gray>"
input-search: "<#c084fc>→</#c084fc> <gray>Type a search query in chat:</gray>"

