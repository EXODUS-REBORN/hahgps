error-occurred: "<red>Произошла ошибка: {error}"
world-not-found: "<red>Мир <#8fe9f5>{world}</#8fe9f5> не найден."
distance-format: "{value} м"

# --- Помощь ---
help-header: "<#4fd1e0>═══ Команды GPS ═══</#4fd1e0>"
