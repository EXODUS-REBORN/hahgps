# ============================================================
#  HahGps — сообщения (Русский)
#
#  ОДИН ШАБЛОН: синяя линейка GuiTheme.PALETTE плюс нейтрали.
#  Зелёных, красных, золотых, оранжевых, фиолетовых и розовых
#  оттенков в текстах нет вообще — отличаемся тоном синего.
#  Значения — <white><bold>, подписи — <gray>, разделители —
#  <dark_gray>, служебные пометки — <italic>.
#
#  Смысловые тона (все из синей линейки):
#    #8fe9f5 — ✔ успех (самый светлый тон)
#    #8fc6ff — значения и названия кнопок
#    #66aaff — → подсказки и промпты
#    #4fd1e0 — подсказки «резко вбок»
#    #3f86ff — ✖ ошибки (тёмный тон + жирный)
#
#  Шаблоны строк (одинаковые для всех сообщений):
#    успех   — <#8fe9f5>✔</#8fe9f5> <gray>описание</gray> <white><bold>значение</bold></white>
#    ошибка  — <#3f86ff>✖ описание <white><bold>значение</bold></white></#3f86ff>
#    подсказка— <#66aaff>→</#66aaff> <gray>описание</gray>
#    шапка   — <bold><gradient:#2464c8:#8fe9f5>═══ НАЗВАНИЕ ═══</gradient></bold>
#
#  Шрифт и размер: обычный текст — стандартный шрифт Minecraft.
#  Разница размеров (мини-шрифт uniform) применяется ТОЛЬКО
#  к времени и версиям: <font:minecraft:uniform>…</font>
#  вокруг {date} и {version}.
#  Выделение — декорациями: <bold> — заголовки и значения,
#  <italic> — пояснения.
#
#  Тексты не выходят за границы окон и подсказок: названия
#  и подписи обрезаются кодом (GuiTheme.clipPlain/clipMini).
# ============================================================

prefix: "<gray>[</gray><bold><gradient:#2464c8:#8fe9f5>GPS</gradient></bold><gray>]</gray> "

# Версия схемы палитры: при несовпадении файл заменяется эталоном (старый — в .bak)
palette-version: 5

no-permission: "<#3f86ff>✖ У вас нет прав для выполнения этой команды.</#3f86ff>"
player-only: "<#3f86ff>✖ Эта команда доступна только игрокам.</#3f86ff>"
usage: "<#3f86ff>✖ Использование:</#3f86ff> <bold><white>{usage}</white></bold>"
invalid-args: "<#3f86ff>✖ Неверные аргументы.</#3f86ff> <gray>Использование:</gray> <bold><white>{usage}</white></bold>"

# --- Точки ---
point-created: "<#8fe9f5>✔</#8fe9f5> <gray>Точка</gray> <white><bold>{name}</bold></white> <dark_gray>создана.</dark_gray>"
point-deleted: "<#8fe9f5>✔</#8fe9f5> <gray>Точка</gray> <white><bold>{name}</bold></white> <dark_gray>удалена.</dark_gray>"
point-not-found: "<#3f86ff>✖ Точка <white><bold>{name}</bold></white> не найдена.</#3f86ff>"
point-exists: "<#3f86ff>✖ Точка с именем <white><bold>{name}</bold></white> уже существует.</#3f86ff>"
point-info: |
  <bold><gradient:#2464c8:#8fe9f5>════════ ТОЧКА ════════</gradient></bold>
  <gray>Название:</gray> <white><bold>{name}</bold></white>
  <gray>Категория:</gray> <#8fc6ff>{category}</#8fc6ff>
  <gray>Координаты:</gray> <#8fc6ff><bold>{x}, {y}, {z}</bold></#8fc6ff>
  <gray>Мир:</gray> <white>{world}</white>
  <gray>Рейтинг:</gray> <#8fc6ff><bold>{rating}/10</bold></#8fc6ff> <dark_gray>·</dark_gray> <gray>голосов:</gray> <white>{votes}</white>
  <gray>Автор:</gray> <white>{author}</white>
  <gray>Создана:</gray> <font:minecraft:uniform><white>{date}</white></font>
  <gray>Описание:</gray> <white><italic>{description}</italic></white>
point-rated: "<#8fe9f5>✔</#8fe9f5> <gray>Вы оценили точку</gray> <white><bold>{name}</bold></white> <dark_gray>—</dark_gray> <#8fc6ff><bold>{rating}</bold></#8fc6ff><gray>/10</gray>"
invalid-rating: "<#3f86ff>✖ Рейтинг должен быть от <bold>1</bold> до <bold>10</bold>.</#3f86ff>"
point-list-header: "<bold><gradient:#2464c8:#8fe9f5>═══ ТОЧКИ ({count}) ═══</gradient></bold>"
point-list-entry: "<#8fc6ff>•</#8fc6ff> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <#8fc6ff>★ {rating}</#8fc6ff> <dark_gray>|</dark_gray> <#8fc6ff>{distance}</#8fc6ff>"

# --- Категории ---
category-created: "<#8fe9f5>✔</#8fe9f5> <gray>Категория</gray> <white><bold>{name}</bold></white> <dark_gray>создана.</dark_gray>"
category-deleted: "<#8fe9f5>✔</#8fe9f5> <gray>Категория</gray> <white><bold>{name}</bold></white> <dark_gray>удалена.</dark_gray>"
category-not-found: "<#3f86ff>✖ Категория <white><bold>{name}</bold></white> не найдена.</#3f86ff>"
category-exists: "<#3f86ff>✖ Категория с таким именем уже существует.</#3f86ff>"
cannot-delete-default: "<#3f86ff>✖ Нельзя удалить стандартную категорию.</#3f86ff>"
category-list-header: "<bold><gradient:#2464c8:#8fe9f5>═══ КАТЕГОРИИ ({count}) ═══</gradient></bold>"
category-list-entry: "<#8fc6ff>•</#8fc6ff> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <gray>точек:</gray> <#8fc6ff><bold>{count}</bold></#8fc6ff>"

# --- Маршруты и навигация ---
route-started: "<#8fe9f5>✔</#8fe9f5> <gray>Навигация к</gray> <white><bold>{name}</bold></white> <dark_gray>начата · осталось</dark_gray> <#8fc6ff><bold>{distance}</bold></#8fc6ff>"
route-stopped: "<#8fe9f5>✔</#8fe9f5> <gray>Навигация остановлена.</gray>"
no-active-route: "<#3f86ff>✖ У вас нет активной навигации.</#3f86ff>"
arrival: "<#8fe9f5><bold>✔ ЦЕЛЬ ДОСТИГНУТА</bold></#8fe9f5>"

# --- Подсказки: та же синяя лестница, от светлого к тёмному ---
hint-straight: "<#8fe9f5><bold>↑ Идите прямо</bold></#8fe9f5>"
hint-slight-right: "<#8fc6ff><bold>↗ Слегка направо</bold></#8fc6ff>"
hint-right: "<#66aaff><bold>→ Поверните направо</bold></#66aaff>"
hint-sharp-right: "<#4fd1e0><bold>↘ Резко направо</bold></#4fd1e0>"
hint-back: "<#3f86ff><bold>↩ Развернитесь</bold></#3f86ff>"
hint-sharp-left: "<#4fd1e0><bold>↙ Резко налево</bold></#4fd1e0>"
hint-left: "<#66aaff><bold>← Поверните налево</bold></#66aaff>"
hint-slight-left: "<#8fc6ff><bold>↖ Слегка налево</bold></#8fc6ff>"

# --- Журналирование ---
log-enabled: "<#8fe9f5>✔</#8fe9f5> <gray>Подсказки в чате включены.</gray>"
log-disabled: "<#8fe9f5>✔</#8fe9f5> <gray>Подсказки в чате выключены.</gray>"

# --- Поиск ---
search-header: "<bold><gradient:#2464c8:#8fe9f5>═══ ПОИСК ({count}) ═══</gradient></bold>"
search-no-results: "<#3f86ff>✖ По запросу <white><bold>{query}</bold></white> ничего не найдено.</#3f86ff>"
search-entry: "<#8fc6ff>•</#8fc6ff> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <#8fc6ff><bold>{match}%</bold></#8fc6ff>"

# --- Прочее ---
reloaded: "<#8fe9f5>✔</#8fe9f5> <gray>Конфигурация HahGps перезагружена.</gray>"
loading-data: "<gray><italic>Загрузка данных…</italic></gray>"
error-occurred: "<#3f86ff>✖ Произошла ошибка:</#3f86ff> <white>{error}</white>"
world-not-found: "<#3f86ff>✖ Мир <white><bold>{world}</bold></white> не найден.</#3f86ff>"
# ВАЖНО: distance-format уходит в BossBar как обычный текст — без MiniMessage-тегов
distance-format: "{value} м"
distance-format-km: "{value} км"

# --- Помощь ---
help-header: "<bold><gradient:#2464c8:#8fe9f5>═══ КОМАНДЫ GPS ═══</gradient></bold>"
help-entry: "<#8fc6ff><bold>{usage}</bold></#8fc6ff> <dark_gray>──</dark_gray> <gray><italic>{description}</italic></gray>"
help-menu: "Открыть главное меню"
help-point: "Управление точками"
help-category: "Управление категориями"
help-route: "Управление маршрутами"
help-goto: "Построить маршрут к точке"
help-search: "Поиск точек"
help-map: "Открыть карту"
help-log: "Подсказки навигации в чате"
help-reload: "Перезагрузить конфигурацию"
help-help: "Показать эту справку"
help-update: "Проверка и установка обновлений"
help-edge: "Управление рёбрами графа дорог"
