# ============================================================
#  HahGps — сообщения (Русский)
# ============================================================

prefix: "<#4fd1e0>[GPS]<reset> "

no-permission: "<red>У вас нет прав для выполнения этой команды."
player-only: "<red>Эта команда доступна только игрокам."
usage: "<red>Использование: <#8fe9f5>{usage}"
invalid-args: "<red>Неверные аргументы. <#8fe9f5>{usage}"

# --- Точки ---
point-created: "<#8fc6ff>Точка <#8fe9f5>{name}</#8fe9f5> успешно создана."
point-deleted: "<#8fc6ff>Точка <#8fe9f5>{name}</#8fe9f5> удалена."
point-not-found: "<red>Точка <#8fe9f5>{name}</#8fe9f5> не найдена."
point-exists: "<red>Точка с именем <#8fe9f5>{name}</#8fe9f5> уже существует."
point-info:
  "<#4fd1e0>══════════ Точка ══════════</#4fd1e0>"
  "<gray>Название:</gray> <white>{name}</white>"
  "<gray>Категория:</gray> {category}"
  "<gray>Координаты:</gray> <white>{x}, {y}, {z}</white>"
  "<gray>Мир:</gray> {world}"
  "<gray>Рейтинг:</gray> <#8fe9f5>{rating}/10</#8fe9f5> <gray>(голосов: {votes})</gray>"
  "<gray>Автор:</gray> {author}"
  "<gray>Создана:</gray> {date}"
  "<gray>Описание:</gray> {description}"
point-rated: "<#8fc6ff>Вы оценили точку <#8fe9f5>{name}</#8fe9f5> на <#8fe9f5>{rating}</#8fe9f5>."
invalid-rating: "<red>Рейтинг должен быть от 1 до 10."
point-list-header: "<#4fd1e0>═══ Все точки ({count}) ═══</#4fd1e0>"
point-list-entry: "<#8fe9f5>•</#8fe9f5> {name} <gray>|</gray> {category} <gray>|</gray> ★{rating} <gray>|</gray> {distance}м"

# --- Категории ---
category-created: "<#8fc6ff>Категория <#8fe9f5>{name}</#8fe9f5> создана."
category-deleted: "<#8fc6ff>Категория <#8fe9f5>{name}</#8fe9f5> удалена."
category-not-found: "<red>Категория <#8fe9f5>{name}</#8fe9f5> не найдена."
category-exists: "<red>Категория с таким именем уже существует."
cannot-delete-default: "<red>Нельзя удалить стандартную категорию."
category-list-header: "<#4fd1e0>═══ Категории ({count}) ═══</#4fd1e0>"
category-list-entry: "<#8fe9f5>•</#8fe9f5> {name} <gray>({count} точек)</gray>"

# --- Маршруты и навигация ---
route-started: "<#8fc6ff>Навигация к <#8fe9f5>{name}</#8fe9f5> начата. Расстояние: <#8fe9f5>{distance} м</#8fe9f5>."
route-stopped: "<#8fc6ff>Навигация остановлена."
no-active-route: "<red>У вас нет активной навигации."
arrival: "<#8fc6ff>✔ Цель достигнута!"

# --- Подсказки ---
hint-straight: "<gray>↑ Идите прямо</gray>"
hint-slight-right: "<#8fe9f5>↗ Направо</#8fe9f5>"
hint-right: "<#8fe9f5>→ Поверните направо</#8fe9f5>"
hint-sharp-right: "<#8fe9f5>↘ Резко направо</#8fe9f5>"
hint-back: "<red>↩ Развернитесь</red>"
hint-sharp-left: "<#8fe9f5>↙ Резко налево</#8fe9f5>"
hint-left: "<#8fe9f5>← Поверните налево</#8fe9f5>"
hint-slight-left: "<#8fe9f5>↖ Налево</#8fe9f5>"

# --- Журналирование ---
log-enabled: "<#8fc6ff>Журнализация маршрута включена."
log-disabled: "<#8fc6ff>Журнализация маршрута выключена."

# --- Поиск ---
search-header: "<#4fd1e0>═══ Результаты поиска ({count}) ═══</#4fd1e0>"
search-no-results: "<red>По запросу <#8fe9f5>{query}</#8fe9f5> ничего не найдено."
search-entry: "<#8fe9f5>•</#8fe9f5> {name} <gray>|</gray> {match}%"

# --- Прочее ---
reloaded: "<#8fc6ff>Конфигурация HahGps перезагружена."
