# --- Обновления (/gps update) ---
update-checking: "<gray><italic>Проверяю релизы…</italic></gray>"
update-downloading: "<gray><italic>Скачиваю новую версию…</italic></gray>"
update-nothing-to-apply: "<#3f86ff>✖ Применять нечего — сначала подготовьте обновление:</#3f86ff> <bold><white>/gps update install</white></bold>"
update-hotswap-failed: "<#3f86ff>✖ Горячая подмена не удалась:</#3f86ff> <white>{reason}</white>"
update-reloaded: "<#8fe9f5>✔</#8fe9f5> <gray>Настройки обновления перечитаны.</gray>"

# --- Оповещения об обновлении (только группам из обновление.группы-оповещения) ---
update-available: "<#8fe9f5><bold>⬆ Доступно обновление</bold></#8fe9f5> <font:minecraft:uniform><white>{version}</white></font> <dark_gray>·</dark_gray> <gray>вышло</gray> <font:minecraft:uniform><white>{date}</white></font>"
