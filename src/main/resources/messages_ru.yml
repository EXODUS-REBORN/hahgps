# ============================================================
#  HahGps — сообщения (Русский)
#
#  Палитра основного плагина hahtojer (GuiTheme.TONES):
#  #08122b #0e2450 #14397e #1d51a8 #2464c8 #3f86ff #66aaff
#  #8fc6ff #4fd1e0 #8fe9f5
#  Нейтральные: <white> — значения, <gray> — пояснения,
#  <dark_gray> — разделители, <red> — только ошибки.
#
#  Шрифты (ванильные, ресурспак не нужен):
#  <font:minecraft:uniform> — пиксельный моноширинный: шапки,
#      заголовки окон, все цифры (координаты, расстояния, страницы).
#      Полное покрытие: кириллица, цифры, символы.
#  <font:minecraft:alt> — руны столов зачарований: ТОЛЬКО чистая
#      латиница (A-Z, a-z, пробел). Цифры и кириллица в нём не
#      рисуются — для них тег не применять.
#  Обычный текст — стандартный шрифт Minecraft.
# ============================================================

prefix: "<gray>[</gray><font:minecraft:alt><gradient:#2464c8:#8fe9f5>GPS</gradient></font><gray>]</gray> "

# Версия схемы палитры: при несовпадении файл заменяется эталоном (старый — в .bak)
palette-version: 3

no-permission: "<red>✖ У вас нет прав для выполнения этой команды."
player-only: "<red>✖ Эта команда доступна только игрокам."
usage: "<red>✖ Использование: <font:minecraft:uniform><white>{usage}</white></font>"
invalid-args: "<red>✖ Неверные аргументы. <font:minecraft:uniform><white>{usage}</white></font>"

# --- Точки ---
point-created: "<#8fe9f5>✔</#8fe9f5> <gray>Точка</gray> <white>{name}</white> <dark_gray>создана.</dark_gray>"
point-deleted: "<#8fe9f5>✔</#8fe9f5> <gray>Точка</gray> <white>{name}</white> <dark_gray>удалена.</dark_gray>"
point-not-found: "<red>✖ Точка <white>{name}</white> не найдена."
point-exists: "<red>✖ Точка с именем <white>{name}</white> уже существует."
point-info: |
  <font:minecraft:uniform><gradient:#2464c8:#8fe9f5>════════ ТОЧКА ════════</gradient></font>
  <gray>Название:</gray> <white>{name}</white>
  <gray>Категория:</gray> <white>{category}</white>
  <gray>Координаты:</gray> <font:minecraft:uniform><#8fe9f5>{x}, {y}, {z}</#8fe9f5></font>
  <gray>Мир:</gray> <white>{world}</white>
  <gray>Рейтинг:</gray> <font:minecraft:uniform><#8fe9f5>{rating}/10</#8fe9f5></font> <dark_gray>· голосов: <font:minecraft:uniform>{votes}</font></dark_gray>
  <gray>Автор:</gray> <white>{author}</white>
  <gray>Создана:</gray> <font:minecraft:uniform><white>{date}</white></font>
  <gray>Описание:</gray> <white>{description}</white>
point-rated: "<#8fe9f5>✔</#8fe9f5> <gray>Оценка точки</gray> <white>{name}</white> <dark_gray>—</dark_gray> <font:minecraft:uniform><#8fe9f5>{rating}</#8fe9f5>/10</font>"
invalid-rating: "<red>✖ Рейтинг должен быть от <font:minecraft:uniform>1</font> до <font:minecraft:uniform>10</font>."
point-list-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ ТОЧКИ ({count}) ═══</gradient></font>"
point-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <font:minecraft:uniform><#8fe9f5>★{rating}</#8fe9f5></font> <dark_gray>|</dark_gray> <font:minecraft:uniform><gray>{distance}м</gray></font>"

# --- Категории ---
category-created: "<#8fe9f5>✔</#8fe9f5> <gray>Категория</gray> <white>{name}</white> <dark_gray>создана.</dark_gray>"
category-deleted: "<#8fe9f5>✔</#8fe9f5> <gray>Категория</gray> <white>{name}</white> <dark_gray>удалена.</dark_gray>"
category-not-found: "<red>✖ Категория <white>{name}</white> не найдена."
category-exists: "<red>✖ Категория с таким именем уже существует."
cannot-delete-default: "<red>✖ Нельзя удалить стандартную категорию."
category-list-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ КАТЕГОРИИ ({count}) ═══</gradient></font>"
category-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>(</dark_gray><font:minecraft:uniform><gray>{count}</gray></font> <gray>точек</gray><dark_gray>)</dark_gray>"

# --- Маршруты и навигация ---
route-started: "<#8fe9f5>✔</#8fe9f5> <gray>Навигация к</gray> <white>{name}</white> <dark_gray>начата · осталось</dark_gray> <font:minecraft:uniform><#8fe9f5>{distance} м</#8fe9f5></font>"
route-stopped: "<#8fe9f5>✔</#8fe9f5> <gray>Навигация остановлена.</gray>"
no-active-route: "<red>✖ У вас нет активной навигации."
arrival: "<font:minecraft:uniform><#8fe9f5>✔ ЦЕЛЬ ДОСТИГНУТА</#8fe9f5></font>"

# --- Подсказки ---
hint-straight: "<font:minecraft:uniform><#66aaff>↑ Идите прямо</#66aaff></font>"
hint-slight-right: "<font:minecraft:uniform><#8fc6ff>↗ Направо</#8fc6ff></font>"
hint-right: "<font:minecraft:uniform><#8fc6ff>→ Поверните направо</#8fc6ff></font>"
hint-sharp-right: "<font:minecraft:uniform><#8fe9f5>↘ Резко направо</#8fe9f5></font>"
hint-back: "<font:minecraft:uniform><#3f86ff>↩ Развернитесь</#3f86ff></font>"
hint-sharp-left: "<font:minecraft:uniform><#8fe9f5>↙ Резко налево</#8fe9f5></font>"
hint-left: "<font:minecraft:uniform><#8fc6ff>← Поверните налево</#8fc6ff></font>"
hint-slight-left: "<font:minecraft:uniform><#8fc6ff>↖ Налево</#8fc6ff></font>"

# --- Журналирование ---
log-enabled: "<#8fe9f5>✔</#8fe9f5> <gray>Журнализация маршрута включена.</gray>"
log-disabled: "<#8fe9f5>✔</#8fe9f5> <gray>Журнализация маршрута выключена.</gray>"

# --- Поиск ---
search-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ ПОИСК ({count}) ═══</gradient></font>"
search-no-results: "<red>✖ По запросу <white>{query}</white> ничего не найдено."
search-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <font:minecraft:uniform><#8fe9f5>{match}%</#8fe9f5></font>"

# --- Прочее ---
reloaded: "<#8fe9f5>✔</#8fe9f5> <gray>Конфигурация HahGps перезагружена.</gray>"
loading-data: "<gray>Загрузка данных…</gray>"
error-occurred: "<red>✖ Произошла ошибка: <white>{error}</white>"
world-not-found: "<red>✖ Мир <white>{world}</white> не найден."
# ВАЖНО: distance-format уходит в BossBar как обычный текст — без MiniMessage-тегов
distance-format: "{value} м"
distance-format-km: "{value} км"

# --- Помощь ---
help-header: "<font:minecraft:uniform><gradient:#2464c8:#8fe9f5>═══ КОМАНДЫ GPS ═══</gradient></font>"
help-entry: "<font:minecraft:uniform><#8fc6ff>{usage}</#8fc6ff></font> <dark_gray>──</dark_gray> <gray>{description}</gray>"
help-menu: "Открыть главное меню"
help-point: "Управление точками"
help-category: "Управление категориями"
help-route: "Управление маршрутами"
help-goto: "Построить маршрут к точке"
help-search: "Поиск точек"
help-map: "Открыть карту"
help-log: "Переключить подсказки"
help-reload: "Перезагрузить конфиг"
help-help: "Показать эту справку"
help-update: "Проверка и установка обновлений"
help-edge: "Управление рёбрами графа дорог"
help-visual: "Визуализация графа дорог"

# --- Обновления (/gps update) ---
update-checking: "<gray>Проверяю релизы…</gray>"
update-downloading: "<gray>Проверяю и скачиваю новую версию…</gray>"
update-nothing-to-apply: "<red>✖ Применять нечего: подготовленного обновления нет <dark_gray>(сначала</dark_gray> <font:minecraft:uniform><white>/gps update install</white></font><dark_gray>)</dark_gray>."
update-hotswap-failed: "<red>✖ Горячая подмена не удалась: <white>{reason}</white>"
update-reloaded: "<#8fe9f5>✔</#8fe9f5> <gray>Настройки обновления перечитаны.</gray>"

# --- Оповещения об обновлении (группам из обновление.группы-оповещения) ---
update-available: "<gray>Доступно новое обновление:</gray> <font:minecraft:uniform><white>{version}</white></font> <dark_gray>·</dark_gray> <gray>вышло:</gray> <font:minecraft:uniform><white>{date}</white></font>"
update-whats-new: "<gray>Что нового:</gray> <white>{notes}</white>"
update-downloading-now: "<gray>Скачиваю обновление…</gray>"
update-staged: "<#8fe9f5>✔</#8fe9f5> <gray>Обновление</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>скачано и проверено — готово к установке.</gray>"
update-installed: "<#8fe9f5>✔</#8fe9f5> <gray>Обновление</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>успешно установлено — сервер не перезапускался.</gray>"
update-failed: "<red>✖ Обновление не удалось: <white>{error}</white></red>"

# --- Ввод в чате ---
input-category-create: "<gray>→ Напиши название новой категории в чат:</gray>"
input-category-delete: "<gray>→ Напиши название категории, которую нужно удалить, в чат:</gray>"
input-rate: "<gray>→ Оцени точку от</gray> <font:minecraft:uniform><#8fe9f5>1</#8fe9f5></font> <gray>до</gray> <font:minecraft:uniform><#8fe9f5>10</#8fe9f5></font> <dark_gray>— напиши число в чат:</dark_gray>"
input-search: "<gray>→ Напиши поисковый запрос в чат:</gray>"

