# ============================================================
#  HahGps — сообщения (Русский)
# ============================================================

prefix: "<#8fc6ff>[GPS]<reset> "

no-permission: "<#3f86ff>У вас нет прав для выполнения этой команды."
player-only: "<#3f86ff>Эта команда доступна только игрокам."
usage: "<#3f86ff>Использование: <#b8dcff>{usage}"
invalid-args: "<#3f86ff>Неверные аргументы. <#b8dcff>{usage}"

# --- Точки ---
point-created: "<#8fc6ff>Точка <#b8dcff>{name}</#b8dcff> успешно создана."
point-deleted: "<#8fc6ff>Точка <#b8dcff>{name}</#b8dcff> удалена."
point-not-found: "<#3f86ff>Точка <#b8dcff>{name}</#b8dcff> не найдена."
point-exists: "<#3f86ff>Точка с именем <#b8dcff>{name}</#b8dcff> уже существует."
point-info: |
  <#8fc6ff>══════════ Точка ══════════</#8fc6ff>
  <#c8e4ff>Название:</#c8e4ff> <white>{name}</white>
  <#c8e4ff>Категория:</#c8e4ff> {category}
  <#c8e4ff>Координаты:</#c8e4ff> <white>{x}, {y}, {z}</white>
  <#c8e4ff>Мир:</#c8e4ff> {world}
  <#c8e4ff>Рейтинг:</#c8e4ff> <#b8dcff>{rating}/10</#b8dcff> <#c8e4ff>(голосов: {votes})</#c8e4ff>
  <#c8e4ff>Автор:</#c8e4ff> {author}
  <#c8e4ff>Создана:</#c8e4ff> {date}
  <#c8e4ff>Описание:</#c8e4ff> {description}
point-rated: "<#8fc6ff>Вы оценили точку <#b8dcff>{name}</#b8dcff> на <#b8dcff>{rating}</#b8dcff>."
invalid-rating: "<#3f86ff>Рейтинг должен быть от 1 до 10."
point-list-header: "<#8fc6ff>═══ Все точки ({count}) ═══</#8fc6ff>"
point-list-entry: "<#b8dcff>•</#b8dcff> {name} <#c8e4ff>|</#c8e4ff> {category} <#c8e4ff>|</#c8e4ff> ★{rating} <#c8e4ff>|</#c8e4ff> {distance}м"

# --- Категории ---
category-created: "<#8fc6ff>Категория <#b8dcff>{name}</#b8dcff> создана."
category-deleted: "<#8fc6ff>Категория <#b8dcff>{name}</#b8dcff> удалена."
category-not-found: "<#3f86ff>Категория <#b8dcff>{name}</#b8dcff> не найдена."
category-exists: "<#3f86ff>Категория с таким именем уже существует."
cannot-delete-default: "<#3f86ff>Нельзя удалить стандартную категорию."
category-list-header: "<#8fc6ff>═══ Категории ({count}) ═══</#8fc6ff>"
category-list-entry: "<#b8dcff>•</#b8dcff> {name} <#c8e4ff>({count} точек)</#c8e4ff>"

# --- Маршруты и навигация ---
route-started: "<#8fc6ff>Навигация к <#b8dcff>{name}</#b8dcff> начата. Расстояние: <#b8dcff>{distance} м</#b8dcff>."
route-stopped: "<#8fc6ff>Навигация остановлена."
no-active-route: "<#3f86ff>У вас нет активной навигации."
arrival: "<#8fc6ff>✔ Цель достигнута!"

# --- Подсказки ---
hint-straight: "<#c8e4ff>↑ Идите прямо</#c8e4ff>"
hint-slight-right: "<#b8dcff>↗ Направо</#b8dcff>"
hint-right: "<#b8dcff>→ Поверните направо</#b8dcff>"
hint-sharp-right: "<#b8dcff>↘ Резко направо</#b8dcff>"
hint-back: "<#3f86ff>↩ Развернитесь</#3f86ff>"
hint-sharp-left: "<#b8dcff>↙ Резко налево</#b8dcff>"
hint-left: "<#b8dcff>← Поверните налево</#b8dcff>"
hint-slight-left: "<#b8dcff>↖ Налево</#b8dcff>"

# --- Журналирование ---
log-enabled: "<#8fc6ff>Журнализация маршрута включена."
log-disabled: "<#8fc6ff>Журнализация маршрута выключена."

# --- Поиск ---
search-header: "<#8fc6ff>═══ Результаты поиска ({count}) ═══</#8fc6ff>"
search-no-results: "<#3f86ff>По запросу <#b8dcff>{query}</#b8dcff> ничего не найдено."
search-entry: "<#b8dcff>•</#b8dcff> {name} <#c8e4ff>|</#c8e4ff> {match}%"

# --- Прочее ---
reloaded: "<#8fc6ff>Конфигурация HahGps перезагружена."
loading-data: "<#c8e4ff>Загрузка данных...</#c8e4ff>"
error-occurred: "<#3f86ff>Произошла ошибка: {error}"
world-not-found: "<#3f86ff>Мир <#b8dcff>{world}</#b8dcff> не найден."
distance-format: "{value} м"

# --- Помощь ---
