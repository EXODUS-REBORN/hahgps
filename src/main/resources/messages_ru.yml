# ============================================================
#  HahGps — сообщения (Русский)
#
#  Палитра основного плагина hahtojer (GuiTheme.TONES):
#  #08122b #0e2450 #14397e #1d51a8 #2464c8 #3f86ff #66aaff
#  #8fc6ff #4fd1e0 #8fe9f5
#  Нейтральные: <white> — значения, <gray> — пояснения,
#  <dark_gray> — разделители, <red> — только ошибки.
# ============================================================

prefix: "<gray>[</gray><gradient:#2464c8:#8fe9f5>GPS</gradient><gray>]</gray> "

# Версия схемы палитры: при несовпадении файл заменяется эталоном (старый — в .bak)
palette-version: 2

no-permission: "<red>У вас нет прав для выполнения этой команды."
player-only: "<red>Эта команда доступна только игрокам."
usage: "<red>Использование: <white>{usage}"
invalid-args: "<red>Неверные аргументы. <white>{usage}"

# --- Точки ---
point-created: "<#8fc6ff>Точка <white>{name}</white> успешно создана."
point-deleted: "<#8fc6ff>Точка <white>{name}</white> удалена."
point-not-found: "<red>Точка <white>{name}</white> не найдена."
point-exists: "<red>Точка с именем <white>{name}</white> уже существует."
point-info: |
  <#8fc6ff>══════════ Точка ══════════</#8fc6ff>
  <gray>Название:</gray> <white>{name}</white>
  <gray>Категория:</gray> <white>{category}</white>
  <gray>Координаты:</gray> <white>{x}, {y}, {z}</white>
  <gray>Мир:</gray> <white>{world}</white>
  <gray>Рейтинг:</gray> <#8fe9f5>{rating}/10</#8fe9f5> <dark_gray>(голосов: {votes})</dark_gray>
  <gray>Автор:</gray> <white>{author}</white>
  <gray>Создана:</gray> <white>{date}</white>
  <gray>Описание:</gray> <white>{description}</white>
point-rated: "<#8fc6ff>Вы оценили точку <white>{name}</white> на <#8fe9f5>{rating}</#8fe9f5>."
invalid-rating: "<red>Рейтинг должен быть от 1 до 10."
point-list-header: "<#8fc6ff>═══ Все точки ({count}) ═══</#8fc6ff>"
point-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <#8fe9f5>★{rating}</#8fe9f5> <dark_gray>|</dark_gray> <gray>{distance}м</gray>"

# --- Категории ---
category-created: "<#8fc6ff>Категория <white>{name}</white> создана."
category-deleted: "<#8fc6ff>Категория <white>{name}</white> удалена."
category-not-found: "<red>Категория <white>{name}</white> не найдена."
category-exists: "<red>Категория с таким именем уже существует."
cannot-delete-default: "<red>Нельзя удалить стандартную категорию."
category-list-header: "<#8fc6ff>═══ Категории ({count}) ═══</#8fc6ff>"
category-list-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>(</dark_gray><gray>{count} точек</gray><dark_gray>)</dark_gray>"

# --- Маршруты и навигация ---
route-started: "<#8fc6ff>Навигация к <white>{name}</white> начата. Расстояние: <#8fe9f5>{distance} м</#8fe9f5>."
route-stopped: "<#8fc6ff>Навигация остановлена."
no-active-route: "<red>У вас нет активной навигации."
arrival: "<#8fe9f5>✔ Цель достигнута!"

# --- Подсказки ---
hint-straight: "<#66aaff>↑ Идите прямо</#66aaff>"
hint-slight-right: "<#8fc6ff>↗ Направо</#8fc6ff>"
hint-right: "<#8fc6ff>→ Поверните направо</#8fc6ff>"
hint-sharp-right: "<#8fe9f5>↘ Резко направо</#8fe9f5>"
hint-back: "<#3f86ff>↩ Развернитесь</#3f86ff>"
hint-sharp-left: "<#8fe9f5>↙ Резко налево</#8fe9f5>"
hint-left: "<#8fc6ff>← Поверните налево</#8fc6ff>"
hint-slight-left: "<#8fc6ff>↖ Налево</#8fc6ff>"

# --- Журналирование ---
log-enabled: "<#8fc6ff>Журнализация маршрута включена."
log-disabled: "<#8fc6ff>Журнализация маршрута выключена."

# --- Поиск ---
search-header: "<#8fc6ff>═══ Результаты поиска ({count}) ═══</#8fc6ff>"
search-no-results: "<red>По запросу <white>{query}</white> ничего не найдено."
search-entry: "<gray>•</gray> <white>{name}</white> <dark_gray>|</dark_gray> <#8fe9f5>{match}%</#8fe9f5>"

# --- Прочее ---
reloaded: "<#8fc6ff>Конфигурация HahGps перезагружена."
loading-data: "<gray>Загрузка данных...</gray>"
error-occurred: "<red>Произошла ошибка: <white>{error}</white>"
world-not-found: "<red>Мир <white>{world}</white> не найден."
distance-format: "{value} м"
distance-format-km: "{value} км"

# --- Помощь ---
help-header: "<#8fc6ff>═══ Команды GPS ═══</#8fc6ff>"
help-entry: "<#8fc6ff>{usage}</#8fc6ff> <gray>— {description}</gray>"
help-menu: "Открыть главное меню"
help-point: "Управление точками"
help-category: "Управление категориями"
help-route: "Управление маршрутами"
help-goto: "Построить маршрут к точке"
help-search: "Поиск точек"
help-map: "Открыть карту"
help-log: "Переключить подсказки"
help-reload: "Перезагрузить конфиг"
help-help: "Показать эту справку"
help-update: "Проверка и установка обновлений"
help-edge: "Управление рёбрами графа дорог"
help-visual: "Визуализация графа дорог"

# --- Обновления (/gps update) ---
update-checking: "<#8fc6ff>Проверяю релизы…"
update-downloading: "<#8fc6ff>Проверяю и скачиваю новую версию…"
update-nothing-to-apply: "<#8fc6ff>Применять нечего: подготовленного обновления нет (сначала &f/gps update install<#8fc6ff>)."
update-hotswap-failed: "<red>Горячая подмена не удалась: <white>{reason}</white>"
update-reloaded: "<#8fc6ff>Настройки обновления перечитаны."

# --- Ввод в чате ---
input-category-create: "<#8fc6ff>Напиши название новой категории в чат:</#8fc6ff>"
input-category-delete: "<#8fc6ff>Напиши название категории, которую нужно удалить, в чат:</#8fc6ff>"
input-rate: "<#8fc6ff>Оцени точку от 1 до 10 — напиши число в чате:</#8fc6ff>"
input-search: "<#8fc6ff>Напиши поисковый запрос в чат:</#8fc6ff>"

