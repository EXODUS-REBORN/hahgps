update-downloading-now: "<gray><italic>Скачиваю обновление…</italic></gray>"
update-staged: "<#8fe9f5>✔</#8fe9f5> <gray>Обновление</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>скачано и проверено — готово к установке.</gray>"
update-installed: "<#8fe9f5>✔</#8fe9f5> <gray>Обновление</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>успешно установлено — сервер не перезапускался.</gray>"
update-failed: "<#3f86ff>✖ Обновление не удалось:</#3f86ff> <white>{error}</white>"

# --- Ввод в чат ---
input-category-create: "<#66aaff>→</#66aaff> <gray>Напиши название новой категории в чат:</gray>"
input-category-delete: "<#66aaff>→</#66aaff> <gray>Напиши название категории, которую нужно удалить:</gray>"
input-rate: "<#66aaff>→</#66aaff> <gray>Оцени точку от</gray> <#8fc6ff><bold>1</bold></#8fc6ff> <gray>до</gray> <#8fc6ff><bold>10</bold></#8fc6ff> <dark_gray>— напиши число в чат:</dark_gray>"
input-search: "<#66aaff>→</#66aaff> <gray>Напиши поисковый запрос в чат:</gray>"

