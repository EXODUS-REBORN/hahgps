# ============================================================
#  HahGps — сообщения (Русский)
#
#  Цвета — RGB-палитра GuiTheme.PALETTE: в текстах используются
#  десятки оттенков (синий, бирюза, зелёный, золото, оранжевый,
#  фиолетовый, розовый, красный), а не 3–4 цвета.
#  Нейтральные: <white> — значения, <gray> — подписи,
#  <dark_gray> — разделители.
#
#  Шрифт и размер: обычный текст — стандартный шрифт Minecraft.
#  Разница размеров (мини-шрифт uniform) применяется ТОЛЬКО
#  к времени и версиям: <font:minecraft:uniform>…</font>
#  вокруг {date} и {version}.
#  Выделение — декорациями: <bold> — заголовки и значения,
#  <italic> — пояснения, <underlined>/<strikethrough> — акценты.
#
#  Шаблоны строк (единые для всех сообщений):
#    успех  — <#4ade80>✔</#4ade80> <gray>описание</gray> <white>значение</white>
#    ошибка — <#f87171>✖ описание <white>значение</white></#f87171>
#    подсказка — <#c084fc>→</#c084fc> <gray>описание</gray>
#    шапка  — <bold><gradient:…>═══ НАЗВАНИЕ ═══</gradient></bold>
#
#  Тексты не выходят за границы окон и подсказок: названия
#  и подписи обрезаются кодом (GuiTheme.clipPlain/clipMini).
# ============================================================

prefix: "<gray>[</gray><bold><gradient:#2464c8:#8fe9f5>GPS</gradient></bold><gray>]</gray> "

# Версия схемы палитры: при несовпадении файл заменяется эталоном (старый — в .bak)
palette-version: 4

no-permission: "<#f87171>✖ У вас нет прав для выполнения этой команды.</#f87171>"
player-only: "<#f87171>✖ Эта команда доступна только игрокам.</#f87171>"
usage: "<#f87171>✖ Использование:</#f87171> <bold><white>{usage}</white></bold>"
invalid-args: "<#f87171>✖ Неверные аргументы.</#f87171> <gray>Использование:</gray> <bold><white>{usage}</white></bold>"

# --- Точки ---
point-created: "<#4ade80>✔</#4ade80> <gray>Точка</gray> <white><bold>{name}</bold></white> <dark_gray>создана.</dark_gray>"
point-deleted: "<#4ade80>✔</#4ade80> <gray>Точка</gray> <white><bold>{name}</bold></white> <dark_gray>удалена.</dark_gray>"
point-not-found: "<#f87171>✖ Точка <white><bold>{name}</bold></white> не найдена.</#f87171>"
point-exists: "<#f87171>✖ Точка с именем <white><bold>{name}</bold></white> уже существует.</#f87171>"
point-info: |
  <bold><gradient:#2464c8:#8fe9f5>════════ ТОЧКА ════════</gradient></bold>
  <gray>Название:</gray> <white><bold>{name}</bold></white>
  <gray>Категория:</gray> <#22d3ee>{category}</#22d3ee>
  <gray>Координаты:</gray> <#22d3ee><bold>{x}, {y}, {z}</bold></#22d3ee>
  <gray>Мир:</gray> <white>{world}</white>
  <gray>Рейтинг:</gray> <#fbbf24><bold>{rating}/10</bold></#fbbf24> <dark_gray>·</dark_gray> <gray>голосов:</gray> <white>{votes}</white>
  <gray>Автор:</gray> <white>{author}</white>
  <gray>Создана:</gray> <font:minecraft:uniform><white>{date}</white></font>
  <gray>Описание:</gray> <white><italic>{description}</italic></white>
point-rated: "<#4ade80>✔</#4ade80> <gray>Вы оценили точку</gray> <white><bold>{name}</bold></white> <dark_gray>—</dark_gray> <#fbbf24><bold>{rating}</bold></#fbbf24><gray>/10</gray>"
invalid-rating: "<#f87171>✖ Рейтинг должен быть от <bold>1</bold> до <bold>10</bold>.</#f87171>"
point-list-header: "<bold><gradient:#2464c8:#8fe9f5>═══ ТОЧКИ ({count}) ═══</gradient></bold>"
point-list-entry: "<#22d3ee>•</#22d3ee> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <gray>{category}</gray> <dark_gray>|</dark_gray> <#fbbf24>★ {rating}</#fbbf24> <dark_gray>|</dark_gray> <#4ade80>{distance}</#4ade80>"

# --- Категории ---
category-created: "<#4ade80>✔</#4ade80> <gray>Категория</gray> <white><bold>{name}</bold></white> <dark_gray>создана.</dark_gray>"
category-deleted: "<#4ade80>✔</#4ade80> <gray>Категория</gray> <white><bold>{name}</bold></white> <dark_gray>удалена.</dark_gray>"
category-not-found: "<#f87171>✖ Категория <white><bold>{name}</bold></white> не найдена.</#f87171>"
category-exists: "<#f87171>✖ Категория с таким именем уже существует.</#f87171>"
cannot-delete-default: "<#f87171>✖ Нельзя удалить стандартную категорию.</#f87171>"
category-list-header: "<bold><gradient:#22c55e:#a3e635>═══ КАТЕГОРИИ ({count}) ═══</gradient></bold>"
category-list-entry: "<#4ade80>•</#4ade80> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <gray>точек:</gray> <#a3e635><bold>{count}</bold></#a3e635>"

# --- Маршруты и навигация ---
route-started: "<#4ade80>✔</#4ade80> <gray>Навигация к</gray> <white><bold>{name}</bold></white> <dark_gray>начата · осталось</dark_gray> <#fb923c><bold>{distance}</bold></#fb923c>"
route-stopped: "<#4ade80>✔</#4ade80> <gray>Навигация остановлена.</gray>"
no-active-route: "<#f87171>✖ У вас нет активной навигации.</#f87171>"
arrival: "<#4ade80><bold>✔ ЦЕЛЬ ДОСТИГНУТА</bold></#4ade80>"

# --- Подсказки ---
hint-straight: "<#4ade80><bold>↑ Идите прямо</bold></#4ade80>"
hint-slight-right: "<#22d3ee><bold>↗ Слегка направо</bold></#22d3ee>"
hint-right: "<#38bdf8><bold>→ Поверните направо</bold></#38bdf8>"
hint-sharp-right: "<#818cf8><bold>↘ Резко направо</bold></#818cf8>"
hint-back: "<#f87171><bold>↩ Развернитесь</bold></#f87171>"
hint-sharp-left: "<#818cf8><bold>↙ Резко налево</bold></#818cf8>"
hint-left: "<#38bdf8><bold>← Поверните налево</bold></#38bdf8>"
hint-slight-left: "<#22d3ee><bold>↖ Слегка налево</bold></#22d3ee>"

# --- Журналирование ---
log-enabled: "<#4ade80>✔</#4ade80> <gray>Подсказки в чате включены.</gray>"
log-disabled: "<#4ade80>✔</#4ade80> <gray>Подсказки в чате выключены.</gray>"

# --- Поиск ---
search-header: "<bold><gradient:#a855f7:#f472b6>═══ ПОИСК ({count}) ═══</gradient></bold>"
search-no-results: "<#f87171>✖ По запросу <white><bold>{query}</bold></white> ничего не найдено.</#f87171>"
search-entry: "<#c084fc>•</#c084fc> <white><bold>{name}</bold></white> <dark_gray>|</dark_gray> <#f472b6><bold>{match}%</bold></#f472b6>"

# --- Прочее ---
reloaded: "<#4ade80>✔</#4ade80> <gray>Конфигурация HahGps перезагружена.</gray>"
loading-data: "<gray><italic>Загрузка данных…</italic></gray>"
error-occurred: "<#f87171>✖ Произошла ошибка:</#f87171> <white>{error}</white>"
world-not-found: "<#f87171>✖ Мир <white><bold>{world}</bold></white> не найден.</#f87171>"
# ВАЖНО: distance-format уходит в BossBar как обычный текст — без MiniMessage-тегов
distance-format: "{value} м"
distance-format-km: "{value} км"

# --- Помощь ---
help-header: "<bold><gradient:#3b82f6:#22d3ee>═══ КОМАНДЫ GPS ═══</gradient></bold>"
help-entry: "<#38bdf8><bold>{usage}</bold></#38bdf8> <dark_gray>──</dark_gray> <gray><italic>{description}</italic></gray>"
help-menu: "Открыть главное меню"
help-point: "Управление точками"
help-category: "Управление категориями"
help-route: "Управление маршрутами"
help-goto: "Построить маршрут к точке"
help-search: "Поиск точек"
help-map: "Открыть карту"
help-log: "Подсказки навигации в чате"
help-reload: "Перезагрузить конфигурацию"
help-help: "Показать эту справку"
help-update: "Проверка и установка обновлений"
help-edge: "Управление рёбрами графа дорог"
help-visual: "Визуализация графа дорог"

# --- Обновления (/gps update) ---
update-checking: "<gray><italic>Проверяю релизы…</italic></gray>"
update-downloading: "<gray><italic>Скачиваю новую версию…</italic></gray>"
update-nothing-to-apply: "<#f87171>✖ Применять нечего — сначала подготовьте обновление:</#f87171> <bold><white>/gps update install</white></bold>"
update-hotswap-failed: "<#f87171>✖ Горячая подмена не удалась:</#f87171> <white>{reason}</white>"
update-reloaded: "<#4ade80>✔</#4ade80> <gray>Настройки обновления перечитаны.</gray>"

# --- Оповещения об обновлении (группам из обновление.группы-оповещения) ---
update-available: "<#fbbf24><bold>⬆ Доступно обновление</bold></#fbbf24> <font:minecraft:uniform><white>{version}</white></font> <dark_gray>·</dark_gray> <gray>вышло</gray> <font:minecraft:uniform><white>{date}</white></font>"
update-whats-new: "<gray>Что нового:</gray> <white><italic>{notes}</italic></white>"
update-downloading-now: "<gray><italic>Скачиваю обновление…</italic></gray>"
update-staged: "<#4ade80>✔</#4ade80> <gray>Обновление</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>скачано и проверено — готово к установке.</gray>"
update-installed: "<#4ade80>✔</#4ade80> <gray>Обновление</gray> <font:minecraft:uniform><white>{version}</white></font> <gray>успешно установлено — сервер не перезапускался.</gray>"
update-failed: "<#f87171>✖ Обновление не удалось:</#f87171> <white>{error}</white>"

# --- Ввод в чате ---
input-category-create: "<#c084fc>→</#c084fc> <gray>Напиши название новой категории в чат:</gray>"
