# ============================================================
#  HahGPS — тексты (формат MiniMessage: <red>, <gradient:#aaa:#bbb>, <bold>)
#  Плейсхолдеры пишутся в фигурных скобках: {point}, {remaining} ...
#  ВАЖНО: не используйте угловые скобки в тексте — они зарезервированы MiniMessage.
# ============================================================

prefix: "<gradient:#3fe0ff:#8a5cff><bold>GPS</bold></gradient> <dark_gray>»</dark_gray> "

general:
  players-only: "<red>Команда доступна только игрокам."
  no-permission: "<red>Недостаточно прав для этого действия."
  unknown-transport: "<red>Неизвестный транспорт: <white>{input}</white>. Доступно: <yellow>{types}</yellow>"
  unknown-node: "<red>Точка «{ref}» не найдена. Список: <white>/gps list</white>"
  world-missing: "<red>Мир «{world}» не загружен, маршрут недоступен."

gps:
  help:
    - "<gray>Доступные команды:"
    - " <white>/gps «точка» [транспорт]</white> <dark_gray>—</dark_gray> <gray>проложить маршрут"
    - " <white>/gps off</white> <dark_gray>—</dark_gray> <gray>отменить навигацию"
    - " <white>/gps list</white> <dark_gray>—</dark_gray> <gray>список ключевых точек"
    - "<gray>Транспорт: <yellow>{types}</yellow>"
  started: "<green>Маршрут построен: <white>{dest}</white> <dark_gray>({transport})</dark_gray>"
  stopped: "<yellow>Навигация отменена."
  already: "<yellow>Навигация уже активна. Отмена: <white>/gps off</white>"
  arrived: "<green>Вы прибыли в точку <white>{dest}</white>!"
  arrived-title: "<green>Вы на месте"
  arrived-subtitle: "<gray>{dest}"
  step-done: "<gray>Шаг выполнен: <white>{step}"
  next-step: "<aqua>Далее: <white>{step}"
  recomputed: "<yellow>Маршрут перестроен от текущей позиции."
  recompute-failed: "<red>Не удалось перестроить маршрут."
  degraded: "<yellow>Маршрут для «{transport}» недоступен — построен пеший маршрут."
  list-header: "<aqua>Ключевые точки (<white>{count}</white>):"
  list-entry: " <gray>•</gray> <white>{id}</white> <dark_gray>[{transport}]</dark_gray> <gray>{name} {distance}"
  list-entry-no-name: " <gray>•</gray> <white>{id}</white> <dark_gray>[{transport}]</dark_gray>"
  route-header: "<aqua>План маршрута до <white>{dest}</white> <dark_gray>({transport}, {distance}, ~{time})</dark_gray>"
  plan-entry: " <dark_gray>{index}.</dark_gray> {icon} <white>{title}</white> <dark_gray>—</dark_gray> <gray>{detail}</gray>"
  not-active: "<yellow>Активной навигации нет."

steps:
  walk-title: "Идите до «{target}»"
  walk-detail: "Пешком {distance}, точек на пути: {points}."
  ride-title: "{verb} до «{target}»"
  ride-title-line: "Сядьте на «{line}» и следуйте до «{target}»"
  ride-detail: "В пути {distance}, участков: {points}."
  ride-detail-line: "Линия «{line}», остановок: {stops}, в пути {distance}."
  arrive-title: "Вы уже на месте"

hud:
  # {turn} {icon} {step} {remaining} {total} {percent} {turn_distance} {dest} {transport} {index} {count}
  bossbar: "{turn} {icon} {step} <dark_gray>|</dark_gray> <white>{remaining}</white> <dark_gray>({percent}%)</dark_gray>"
  actionbar: "{turn} {icon} <dark_gray>|</dark_gray> <yellow>{turn_distance}</yellow> <gray>до поворота</gray> <dark_gray>|</dark_gray> <white>осталось {remaining}</white> <dark_gray>|</dark_gray> <gray>→ {next}</gray>"
  actionbar-no-next: "{turn} {icon} <dark_gray>|</dark_gray> <yellow>{turn_distance}</yellow> <gray>до поворота</gray> <dark_gray>|</dark_gray> <white>осталось {remaining}</white>"
  other-world: "<red>Другой мир: <white>{world}</white> <dark_gray>|</dark_gray> <yellow>{remaining}</yellow>"

turns:
  straight: "⬆"
  slight-left: "↖"
  left: "⬅"
  sharp-left: "⬅"
  back: "↩"
  slight-right: "↗"
  right: "➡"
  sharp-right: "➡"
  arrive: "⚑"

admin:
  help:
    - "<gradient:#3fe0ff:#8a5cff><bold>HahGPS</bold></gradient> <gray>— администрирование сетки"
    - " <white>/nav node create «id» [типы]</white> <dark_gray>—</dark_gray> <gray>создать узел в текущей позиции"
    - " <white>/nav node remove «id»</white> <dark_gray>—</dark_gray> <gray>удалить узел"
    - " <white>/nav node name «id» «имя»</white> <dark_gray>—</dark_gray> <gray>задать отображаемое имя"
    - " <white>/nav node allowed «id» add|remove «тип»</white> <dark_gray>—</dark_gray> <gray>слои узла"
    - " <white>/nav node tp «id»</white> <dark_gray>—</dark_gray> <gray>телепорт к узлу"
    - " <white>/nav node list</white> <dark_gray>—</dark_gray> <gray>список узлов"
    - " <white>/nav node info «id»</white> <dark_gray>—</dark_gray> <gray>информация об узле"
    - " <white>/nav edge connect «id1» «id2» [типы] [линия]</white> <dark_gray>—</dark_gray> <gray>связать узлы"
    - " <white>/nav edge allowed «id1» «id2» add|remove «тип»</white> <dark_gray>—</dark_gray> <gray>правка слоёв ребра"
    - " <white>/nav edge oneway «id1» «id2» true|false</white> <dark_gray>—</dark_gray> <gray>одностороннее движение"
    - " <white>/nav edge weight «id1» «id2» «число»</white> <dark_gray>—</dark_gray> <gray>вес ребра"
    - " <white>/nav edge speed «id1» «id2» «блоков_в_сек»</white> <dark_gray>—</dark_gray> <gray>своя скорость ребра (0 — как у слоя)"
    - " <white>/nav edge surface «id1» «id2» «пресет»</white> <dark_gray>—</dark_gray> <gray>покрытие: шоссе/грунтовка/…"
    - " <white>/nav edge line «id1» «id2» «название»</white> <dark_gray>—</dark_gray> <gray>линия/номер транспорта"
    - " <white>/nav edge name «id1» «id2» «название»</white> <dark_gray>—</dark_gray> <gray>название дороги"
    - " <white>/nav edge remove «id1» «id2»</white> <dark_gray>—</dark_gray> <gray>удалить ребро"
    - " <white>/nav edge info «id1» «id2»</white> <dark_gray>—</dark_gray> <gray>информация о ребре"
    - " <white>/nav edge list</white> <dark_gray>—</dark_gray> <gray>список рёбер"
    - " <white>/nav visual [тип|all|off]</white> <dark_gray>—</dark_gray> <gray>визуализация сетки"
    - " <white>/nav reload</white> <dark_gray>—</dark_gray> <gray>перечитать конфиги и сетку"
    - " <white>/nav save</white> <dark_gray>—</dark_gray> <gray>сохранить сетку на диск"
  node-created: "<green>Узел <white>{id}</white> создан: {world} {x}, {y}, {z} <gray>[{transport}]"
  node-exists: "<red>Узел «{id}» уже существует."
  node-removed: "<green>Узел «{id}» удалён. Удалено рёбер: <white>{edges}</white>."
  node-unknown: "<red>Узел «{id}» не найден."
  node-name: "<green>Узел <white>{id}</white> теперь называется <white>{name}</white>."
  node-allowed: "<green>Слои узла <white>{id}</white>: <yellow>{transport}</yellow>"
  node-info:
    - "<aqua>Узел <white>{id}</white> <gray>({name})"
    - " <gray>Мир: <white>{world}</white> <dark_gray>|</dark_gray> <gray>Координаты: <white>{x}, {y}, {z}"
    - " <gray>Слои: <yellow>{transport}</yellow>"
    - " <gray>Рёбер: <white>{edges}</white>"
  node-list-header: "<aqua>Узлы (<white>{count}</white>):"
  node-list-entry: " <gray>•</gray> <white>{id}</white> <dark_gray>[{transport}]</dark_gray> <gray>{name} ({x}, {y}, {z})"
  edge-created: "<green>Ребро <white>{id1} ↔ {id2}</white> создано. Слои: <yellow>{transport}</yellow> <gray>({length})"
  edge-updated: "<green>Ребро <white>{id1} ↔ {id2}</white> обновлено. Слои: <yellow>{transport}</yellow>"
  edge-removed: "<green>Ребро <white>{id1} ↔ {id2}</white> удалено."
  edge-unknown: "<red>Ребро между «{id1}» и «{id2}» не найдено."
  edge-same: "<red>Нельзя связать узел с самим собой."
  edge-allowed: "<green>Слои ребра <white>{id1} ↔ {id2}</white>: <yellow>{transport}</yellow>"
  edge-oneway: "<green>Одностороннее движение <white>{id1} → {id2}</white>: <yellow>{value}</yellow>"
  edge-weight: "<green>Вес ребра <white>{id1} ↔ {id2}</white>: <yellow>{value}</yellow>"
  edge-speed: "<green>Скорость ребра <white>{id1} ↔ {id2}</white>: <yellow>{value}</yellow>"
  edge-surface: "<green>Покрытие ребра <white>{id1} ↔ {id2}</white>: <yellow>{surface}</yellow> <gray>({speed})</gray>"
  surface-unknown: "<red>Неизвестный пресет покрытия: <white>{input}</white>. Доступно: <yellow>{surfaces}</yellow>"
  edge-speed-layer: "по скорости слоя"
  edge-line: "<green>Линия ребра <white>{id1} ↔ {id2}</white>: <yellow>{value}</yellow>"
  edge-name: "<green>Название ребра <white>{id1} ↔ {id2}</white>: <yellow>{value}</yellow>"
  edge-info:
    - "<aqua>Ребро <white>{id1} ↔ {id2}</white>"
    - " <gray>Слои: <yellow>{transport}</yellow> <dark_gray>|</dark_gray> <gray>Длина: <white>{length}</white>"
    - " <gray>Одностороннее: <white>{oneway}</white> <dark_gray>|</dark_gray> <gray>Вес: <white>{weight}</white> <dark_gray>|</dark_gray> <gray>Скорость: <white>{speed}</white>"
    - " <gray>Линия: <white>{line}</white> <dark_gray>|</dark_gray> <gray>Название: <white>{name}</white>"
  edge-list-header: "<aqua>Рёбра (<white>{count}</white>):"
  edge-list-entry: " <gray>•</gray> <white>{id1} ↔ {id2}</white> <dark_gray>[{transport}]</dark_gray> <gray>{length} {line}"
  visual-on: "<green>Визуализация включена: <yellow>{transport}</yellow>"
  visual-off: "<yellow>Визуализация выключена."
  visual-state: "<aqua>Активные слои визуализации: <yellow>{transport}</yellow>"
  reloaded: "<green>Конфигурация и сетка перечитаны. Узлов: <white>{nodes}</white>, рёбер: <white>{edges}</white>."
  saved: "<green>Сетка сохранена в <white>{file}</white>."
  save-failed: "<red>Не удалось сохранить сетку, подробности в консоли."
  graph-empty: "<gray>Сетка пуста. Создайте узлы: <white>/nav node create «id» [типы]</white>"
  label: "<yellow>{id}</yellow> <dark_gray>[{transport}]</dark_gray> <white>{name}</white>"
  label-no-name: "<yellow>{id}</yellow> <dark_gray>[{transport}]</dark_gray>"
