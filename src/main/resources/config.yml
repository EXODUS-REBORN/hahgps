# ============================================================
#  HahGps — конфигурация
# ============================================================

# Язык сообщений: ru | en
language: ru

# ------------------------------------------------------------
# Хранение данных
# ------------------------------------------------------------
storage:
  # sqlite | mysql
  type: sqlite
  sqlite:
    # Файл БД относительно папки плагина
    file: hahgps.db
  mysql:
    host: localhost
    port: 3306
    database: hahgps
    username: root
    password: password
    # Шифровать соединение с MySQL (useSSL в JDBC-строке)
    use-ssl: false

# ------------------------------------------------------------
# Навигация
# ------------------------------------------------------------
navigation:
  # Интервал обновления боссбара в тиках (10-40, меньше не имеет смысла:
  # чаще 10 тиков боссбар не перерисовывается)
  update-interval: 10
  # Радиус достижения цели (блоки)
  arrival-radius: 2.0
  # Цвет и стиль BossBar
  bossbar-color: BLUE
  bossbar-style: SOLID
  # Подсказки в чате при навигации
  log-hints: true
  # Стрелка направления — только в боссбаре вверху экрана
  show-arrow: true
  # HUD ItemsAdder (картинка поверх экрана) — по умолчанию выключен:
  # направление и так показано в боссбаре, дублировать его не нужно
  hud: false
  # Если граф дорог не даёт маршрут, искать пеший путь по блокам: A* обходит
  # стены, прыгает на блок вверх и падает вниз до трёх блоков, а не ведёт
  # по прямой сквозь горы
  walk-fallback: true
  # Дальше этого расстояния пеший путь по блокам не строим (блоки)
  walk-max-distance: 128

# ------------------------------------------------------------
# Карта
# ------------------------------------------------------------
# Рендер карты всегда асинхронный (порционно, с лимитом на тик) — синхронного
# пути нет намеренно: именно он фризил сервер при открытии карты.
# Охват карты задаётся масштабом (ближе → больше блоков на пиксель).
map:
  # Масштаб: FARTHEST | FAR | NORMAL | CLOSE | CLOSEST
  zoom: CLOSE
  # Показывать точки на карте
  show-pois: true
  # Показывать активный маршрут
  show-route: true
  # Показывать других игроков
  show-players: false
  # Свои трекеры iTrak на карте: цвет маячка свой, офлайн (носитель не в
  # сети) — контуром без заливки. Чужие трекеры не показываются.
  show-trackers: true
  # Карта сама едет за игроком: смотреть по сторонам можно, не боясь сдвинуть
  # полотно. false — карта стоит там, куда её сдвинули, и открывается на игроке.
  follow-player: true
  # Как часто обновлять маркеры на открытой карте (другие игроки, трекеры,
  # маршрут), секунд. Слишком маленькое значение — лишние перерисовки.
  refresh-seconds: 5
  # Панорама карты мышью — только с зажатым Shift: поворот мыши сдвигает
  # полотно, как будто его тянут за собой. Без Shift карта не дёргается.
  # ПКМ по карте — центр на себе, Shift+ПКМ — меню карты (зум, следование).
  mouse-pan: true
  # Чувствительность мышиного сдвига (1.0 — как задумано)
  mouse-pan-sensitivity: 1.0
  # Кэш карты мира: исследованные места видны на карте и там, где чанки
  # сейчас не загружены, — панорама не упирается в чёрные дыры
  world-cache: true
  # Блоков на пиксель в кэше карты мира (4, 8 или 16)
  world-cache-blocks-per-pixel: 8

# ------------------------------------------------------------
# Транспорт
# ------------------------------------------------------------
# Виды транспорта, доступные при выборе цели (появляются в меню «Транспорт»).
# Пешком — маршрут по тропинкам и пешеходным переходам.
# Авто — маршрут по дорогам.
# transit / air / water — для рельсов, воздуха и воды: включай, только если
# в графе мира есть рёбра этого типа (см. /gps edge).
transport:
  foot: true
  car: true
  transit: false
  air: false
  water: false

# ------------------------------------------------------------
# Поиск
# ------------------------------------------------------------
search:
  # Максимум результатов
  max-results: 10
  # Порог похожести (0.0 - 1.0)
  similarity-threshold: 0.4

# ------------------------------------------------------------
# iTrak — GPS-трекеры
# ------------------------------------------------------------
# Трекер — предмет: ПКМ по блоку (любая поверхность, даже вода) прицепляет
# его, ПКМ по существу — привязывает к нему и координаты обновляются вживую.
# Обычный трекер в воде тонет и теряет сигнал, водонепроницаемый держится на
# поверхности. Локатор (второй предмет) ищет трекеры поблизости.
itrak:
  # Включены ли трекеры
  enabled: true
  # Как часто (в тиках) обновлять живые координаты и опрашивать сущности
  update-interval: 20
  # Сколько минут без движения считать трекер неподвижным и предлагать маршрут
  stationary-minutes: 1
  # Присылать владельцу и тем, кто следит, сообщение о неподвижности
  stationary-notify: true
  # Маркер трекера виден частицами своего цвета
  particles: true
  # Кому видны частицы-маркеры: true — только тому, кто поставил трекер
  # (чужой игрок не замечает слежку), false — всем в радиусе particle-radius.
  # Локатор находит трекер в любом случае и подсвечивает его нашедшему.
  particles-owner-only: true
  # Кому видны частицы-маркеры, блоков
  particle-radius: 48
  # Радиус поиска обычного локатора, блоков
  scan-radius: 20
  # Радиус дальнего локатора (версия на 30 блоков), блоков
  locator-long-radius: 30
  # Сколько удачных сканирований подряд выдерживает локатор до перезарядки.
  # Пустой скан (рядом ничего нет) попытку не тратит и в перезарядку не уводит.
  scan-attempts: 5
  # Перезарядка после израсходованных попыток, секунд: обычный локатор — 5
  # минут, дальний — 7. Пока идёт перезарядка, на предмете видна белая полоса
  # КД, а сканирование отвечает «перезаряжается, осталось N». 0 — без КД.
  # Полоса видна только на локаторе: у трекеров свои материалы.
  scan-cooldown-seconds: 300
  scan-cooldown-long-seconds: 420
  # Дальность сигнала трекера, блоков. Дальше этого расстояния точные
  # координаты не показываются: видно только район (signal-region-size) и
  # последнее место, которое успело дойти до игрока. 0 — без ограничения.
  signal-range: 100000
  # Размер «квадрата» района при потере сигнала, блоков
  signal-region-size: 512
  # Сколько секунд локатор подсвечивает найденные трекеры
  scan-highlight-seconds: 10
  # С какого расстояния можно подобрать трекер, блоков
  take-radius: 5
  # Сколько трекеров может поставить один игрок
  max-per-player: 8
  # Как часто присылать координаты тем, кто следит за трекером, секунд
  watch-interval-seconds: 5
  # Как часто сохранять сдвинувшиеся координаты в БД, секунд
  save-interval-seconds: 30
  # Как часто перестраивать маршрут к движущемуся трекеру, секунд
  live-route-rebuild-seconds: 10
  # Перестраивать маршрут, только если трекер ушёл дальше этого расстояния
  live-route-rebuild-blocks: 16
  # Разрешить прицеплять трекер к игрокам и другим существам
  attach-players: true
  # Через сколько минут без найденной сущности привязанный трекер перестаёт
  # считаться прицепленным и остаётся на последних координатах. На игроков не
  # действует: с них трекер не слетает, пока его не снимут вручную.
  # 0 — никогда не снимать привязку.
  detach-after-minutes: 30
  # Радиус терминала: нажатие на блок показывает трекеры в нём
  terminal-radius: 5
  # Сколько секунд терминал подсвечивает найденные трекеры
  terminal-highlight-seconds: 10
  # Крафты iTrak, локатора и терминала в верстаке
  crafting: true
  # Через сколько секунд непрерывного дождя обычный (не водонепроницаемый)
  # трекер намокает и перестаёт передавать сигнал. Координаты замирают на
  # последнем месте: трекер видно в меню и на карте, к нему можно построить
  # маршрут и снять его, но локатор его больше не находит, а слежение
  # прекращается. Под крышей и в воде трекер не мокнет. 0 — дождь не вредит.
  rain-ruin-seconds: 60
  # Скорость броска трекера
  throw-speed: 1.8
  # Водонепроницаемый трекер держится на поверхности и плывёт по течению.
  # false — плывущий трекер стоит на месте (как раньше)
  water-current: true
  # Скорость дрейфа по течению, блоков в секунду
  water-drift-speed: 0.8
  # Скорость падения в водопаде и с обрыва, блоков в секунду
  water-fall-speed: 6.0

# ------------------------------------------------------------
# Стандартные категории (создаются при первом запуске)
# ------------------------------------------------------------
default-categories:
  - "Близкие места"
  - "Интересные места"

# ------------------------------------------------------------
# Автообновление из GitHub Releases
# ------------------------------------------------------------
# Токен доступа ищется по порядку: переменная окружения
# HAHTOJER_GITHUB_TOKEN → файл <папка плагина>/github-token.txt →
# файл plugins/hahtojer/github-token.txt (токен основного плагина —
# отдельный заводить не нужно) → ключ ниже.
# Нужен fine-grained токен с правом Contents: Read-only.
обновление:
  # Включена ли проверка новых версий
  включено: true
  # Приватный репозиторий с релизами (owner/name)
  репозиторий: "EXODUS-REBORN/hahgps"
  # Ставить и предрелизы тоже
  предрелизы: false
  # Как часто проверять обновления, минут (0 — только вручную)
  интервал-минут: 5
  # Имя файла с токеном доступа в папке плагина
  файл-ключа: "github-token.txt"
  # Скачивать новую версию автоматически
  авто-скачивание: true
  # Подмена версии на ходу, без перезапуска сервера
  горячее-обновление: true
  # Кому приходят сообщения об обновлении (доступно, что нового, скачивание,
  # успех/ошибка). OP и право gps.admin не считаются — только эти группы.
  # По умолчанию: 41, 42, 103, 555 (технический директор, старший техник,
  # тех-админ, программист).
  группы-оповещения:
    - "41"
    - "42"
    - "103"
    - "555"
  # Игроки, которым оповещения приходят всегда, независимо от группы.
  # Регистр не важен.
  игроки-оповещения:
    - "haker_one"
  # Адрес GitHub API (для GitHub Enterprise и тестов)
  адрес-api: "https://api.github.com"
  # Токен доступа прямо в конфиге (не рекомендуется: config.yml уезжает в копии)
  ключ: ""
