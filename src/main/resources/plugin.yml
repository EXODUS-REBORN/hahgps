name: HahGps
version: '${project.version}'
main: ru.hahgps.HahGpsPlugin
api-version: '1.21'
author: hah
description: GPS navigation plugin for PaperMC
website: https://example.com

commands:
  gps:
    description: Main GPS command
    usage: /gps <subcommand>
    aliases: [navigation, nav]

permissions:
  gps.use:
    description: Basic GPS usage
    default: true
  gps.admin:
    description: Full admin access
    default: op
  gps.point.create:
    description: Create points
    default: true
  gps.point.delete:
    description: Delete points
    default: op
  gps.point.rate:
    description: Rate points
    default: true
  gps.category.create:
    description: Create categories
    default: op
  gps.category.delete:
    description: Delete categories
    default: op
  gps.route.record:
    description: Record routes
    default: op
  gps.route.save:
    description: Save routes
    default: op
  gps.map:
    description: Open map
    default: true
  gps.search:
    description: Search points
    default: true
  gps.transport:
    description: Select transport
    default: true
  gps.reload:
    description: Reload config
    default: op
