name: HahGps
version: '${project.version}'
main: ru.hahgps.HahGpsPlugin
api-version: '1.21'
author: hah
description: GPS navigation plugin for PaperMC
website: https://github.com/EXODUS-REBORN/hahgps

commands:
  gps:
    description: Main GPS command
    usage: /gps <subcommand>
    aliases: [g, navigation, nav]
  itrak:
    description: iTrak GPS trackers (same as /gps itrak)
    usage: /itrak [give|give-locator|scan|find|list|info|route|take|remove|watch|unwatch]
    aliases: [trk]
    permission: gps.itrak

# Права ниже соответствуют подкомандам /gps (см. ru.hahgps.command):
#   gps.use            — point info|list, category list, goto, route start|stop, log, menu, help
#   gps.point.*        — point create|delete|rate
#   gps.category.*     — category create|delete
#   gps.search / gps.reload — одноимённые подкоманды
#   gps.edge / gps.visual / gps.admin — edge, visual, update (объявления об
#   обновлении — не по gps.admin, а группам LuckPerms из обновление.группы-оповещения)
#   gps.route.record / gps.route.save — route record start|stop и route save
#   (/gps reload работает и из консоли, остальные подкоманды — только для игроков;
#    доступность видов транспорта задаётся секцией transport в config.yml, а не правом)
permissions:
  gps.use:
    description: Basic GPS usage
    default: true
  gps.admin:
    description: Full admin access
    default: op
  gps.point.create:
    description: Create points
    default: true
  gps.point.delete:
    description: Delete points
    default: op
  gps.point.rate:
    description: Rate points
    default: true
  gps.category.create:
    description: Create categories
    default: op
  gps.category.delete:
    description: Delete categories
    default: op
  gps.route.record:
    description: Record routes
    default: op
  gps.route.save:
    description: Save recorded routes
    default: op
  gps.search:
    description: Search points
    default: true
  gps.reload:
    description: Reload config
    default: op
  gps.edge:
    description: Manage graph edges
    default: op
  gps.visual:
    description: Toggle grid visualization
    default: op
  gps.itrak:
    description: Use iTrak trackers (place, scan, watch, route)
    default: true
  gps.itrak.give:
    description: Give tracker and locator items
    default: op
  gps.itrak.admin:
    description: See, take and remove any tracker
    default: op
  gps.models:
    description: Place and pick up world models (/gps vmodel)
    default: op
  gps.models.give:
    description: Give model markers (/gps vmodel give)
    default: op
  gps.models.admin:
    description: Sync the model catalog with the panel and reload it
    default: op
