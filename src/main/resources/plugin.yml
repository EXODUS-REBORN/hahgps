name: HahGps
version: '${project.version}'
main: ru.hahgps.HahGpsPlugin
api-version: '1.21'
author: hah
description: GPS navigation plugin for PaperMC
website: https://github.com/EXODUS-REBORN/hahgps

commands:
  gps:
    description: Main GPS command
    usage: /gps <subcommand>
    aliases: [navigation, nav]

# Права ниже соответствуют подкомандам /gps (см. ru.hahgps.command):
#   gps.use            — point info|list, category list, goto, route start|stop, log, menu, help
#   gps.point.*        — point create|delete|rate
#   gps.category.*     — category create|delete
#   gps.search / gps.map / gps.reload — одноимённые подкоманды
#   gps.edge / gps.visual / gps.admin — edge, visual, update (gps.admin также для объявлений обновлений)
#   gps.route.record, gps.route.save, gps.transport — зарезервированы под ещё
#   не реализованные подкоманды (пока кодом не проверяются)
permissions:
  gps.use:
    description: Basic GPS usage
    default: true
  gps.admin:
    description: Full admin access
    default: op
  gps.point.create:
    description: Create points
    default: true
  gps.point.delete:
    description: Delete points
    default: op
  gps.point.rate:
    description: Rate points
    default: true
  gps.category.create:
    description: Create categories
    default: op
  gps.category.delete:
    description: Delete categories
    default: op
  gps.route.record:
    description: Record routes
    default: op
  gps.route.save:
    description: Save routes
    default: op
  gps.map:
    description: Open map
    default: true
  gps.search:
    description: Search points
    default: true
  gps.transport:
    description: Select transport
    default: true
  gps.reload:
    description: Reload config
    default: op
  gps.edge:
    description: Manage graph edges
    default: op
  gps.visual:
    description: Toggle grid visualization
    default: op
