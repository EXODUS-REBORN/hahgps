name: CI

# Сборка на каждый push в main и на каждый pull request: плагин обязан собираться.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven


      - name: Python 3
        uses: actions/setup-python@v5
        with:
          python-version: '3.12'

      - name: Ресурспак (кладётся в jar для /gps pack)
        run: |
          set -euo pipefail
          python3 -m pip install --quiet pillow numpy
          python3 respack/build.py
          test -f respack/dist/hahgps.zip

      - name: Сборка
        run: ./mvnw -B --no-transfer-progress package

      # В plugins/ нельзя заливать два jar с одной парой «имя + версия» из plugin.yml:
      # Paper отказывается грузить второй (duplicate plugin identifier). Проверяем,
      # что в собранном файле идентичность ровно одна и совпадает с pom.xml.
      - name: Идентичность плагина в jar совпадает с pom.xml
        run: |
          set -euo pipefail
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="target/hahgps-${VERSION}.jar"
          YML="$(unzip -p "$JAR" plugin.yml)"
          NAME="$(echo "$YML" | sed -n 's/^name: *//p' | tr -d "'\r")"
          INNER="$(echo "$YML" | sed -n 's/^version: *//p' | tr -d "'\r")"
          echo "файл: $JAR, внутри: $NAME $INNER"
          if [ "$INNER" != "$VERSION" ]; then
            echo "::error::В $JAR версия '$INNER', а в pom.xml '$VERSION'. Плагин не будет грузиться рядом со старым jar."
            exit 1
          fi

      # --release 17 в pom.xml: major 61 — jar должен запускаться на любой JVM новее 17.
      - name: Байт-код не выше Java 17 (major 61)
        run: |
          set -euo pipefail
          VERSION="$(./mvnw -B -q -DforceStdout help:evaluate -Dexpression=project.version)"
          JAR="target/hahgps-${VERSION}.jar"
          unzip -Z1 "$JAR" | grep '^ru/hahgps/.*\.class$' > /tmp/classes.txt
          fail=0
          while read -r c; do
            ver="$(unzip -p "$JAR" "$c" | od -An -tu1 -N8 | awk '{print $7*256+$8}')"
            if [ "$ver" -gt 61 ]; then
              echo "::error::$c major=$ver — класс собран новее Java 17, упадёт с UnsupportedClassVersionError"
              fail=1
            fi
          done < /tmp/classes.txt
          echo "проверено классов: $(wc -l < /tmp/classes.txt)"
          exit $fail


      - name: Jar артефактом
        uses: actions/upload-artifact@v4
        with:
          name: hahgps-jar
          path: target/hahgps-*.jar
          if-no-files-found: error
