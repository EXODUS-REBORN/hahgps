name: CI

# Сборка на каждый push в main и на каждый pull request: плагин обязан собираться.

on:
  push:
    branches: [ main ]
  pull_request:

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Код
        uses: actions/checkout@v4

      - name: Java 21
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: '21'
          cache: maven

      - name: Сборка
        run: mvn -B --no-transfer-progress package

      - name: Jar артефактом
        uses: actions/upload-artifact@v4
        with:
          name: hahgps-jar
          path: target/hahgps-*.jar
          if-no-files-found: error
